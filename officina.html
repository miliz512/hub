g:14px 20px 20px; display:flex; justify-content:flex-end; gap:10px;}\n\n  /* ---------- Pannello dettaglio (slide-over) ---------- */\n  .panel-overlay{position:fixed; inset:0; background:rgba(20,24,30,0.4); z-index:90;}\n  .panel{\n    position:fixed; inset:0; height:100%; width:100%;\n    background:var(--bg); z-index:95; display:flex; flex-direction:column; animation:fadein .15s ease-out;\n  }\n  @keyframes fadein{from{opacity:0;} to{opacity:1;}}\n  .panel-head{padding-left:max(20px,calc((100% - 1400px)/2 + 20px)) !important; padding-right:max(20px,calc((100% - 1400px)/2 + 20px)) !important;}\n  .panel-body{display:grid; grid-template-columns:repeat(auto-fit,minmax(340px,1fr)); gap:18px 24px; align-content:start; align-items:start; max-width:1440px; width:100%; margin:0 auto;}\n  .panel-body .section{margin-bottom:0; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:16px;}\n  .panel-body .costi-sez{grid-column:1/-1;}\n  .costi-form{display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:14px; margin:12px 0;}\n  .costi-box{border:1px solid var(--line); border-radius:10px; padding:12px; background:var(--bg);}\n  .costi-box h4{margin:0 0 8px; font-size:13px;}\n  .costi-box input{width:100%; margin-bottom:8px; padding:10px; border:1px solid var(--line); border-radius:8px; font-size:14px;}\n  .costi-box .due{display:flex; gap:8px;}\n  .panel-foot{max-width:1440px; width:100%; margin:0 auto;}\n  .panel-foot .btn{max-width:260px;}\n  @keyframes slidein{from{transform:translateX(100%);} to{transform:translateX(0);}}\n  .panel-head{padding:18px 20px; border-bottom:1px solid var(--line); background:var(--steel-dark); color:#fff;}\n  .panel-head .row1{display:flex; justify-content:space-between; align-items:flex-start;}\n  .panel-head h2{margin:6px 0 0; font-size:17px; font-weight:600;}\n  .panel-head .sub{font-size:12px; color:#C9D6E0; margin-top:2px;}\n  .panel-close{background:transparent; border:none; color:#fff; font-size:20px; opacity:0.85;}\n  .panel-body{flex:1; overflow-y:auto; padding:18px 20px;}\n  .panel-foot{padding:14px 20px; border-top:1px solid var(--line);}\n  .section{margin-bottom:22px;}\n  .section h3{font-size:12.5px; text-transform:uppercase; letter-spacing:0.04em; color:var(--ink-soft); margin:0 0 10px; font-weight:700;}\n  .stato-select-row{display:flex; gap:8px; flex-wrap:wrap;}\n  .stato-chip{\n    border:1.5px solid var(--line); background:#fff; border-radius:20px; padding:6px 12px;\n    font-size:12.5px; font-weight:600; color:var(--ink-soft);\n  }\n  .stato-chip.active{border-color:var(--chip-color); color:var(--chip-color); background:var(--chip-bg);}\n  .lavoro-row{display:flex; align-items:flex-start; gap:9px; padding:7px 0; border-bottom:1px solid var(--line);}\n  .lavoro-row:last-child{border-bottom:none;}\n  .lavoro-row input[type=checkbox]{margin-top:3px; width:16px; height:16px; accent-color:var(--steel);}\n  .lavoro-row span{font-size:13.5px; flex:1;}\n  .lavoro-row span.done{text-decoration:line-through; color:var(--ink-soft);}\n  .lavoro-row button{background:none; border:none; color:var(--ink-soft); font-size:14px;}\n  .add-lavoro-row{display:flex; gap:8px; margin-top:10px;}\n  .add-lavoro-row input{flex:1; padding:7px 10px; border:1.5px solid var(--line); border-radius:6px; font-size:13.5px;}\n  .ricambi-box textarea{width:100%; min-height:60px; padding:9px 11px; border:1.5px solid var(--line); border-radius:7px; font-size:13.5px; font-family:'Inter',sans-serif;}\n  .note-item{background:var(--grey-bg); border-radius:8px; padding:9px 11px; margin-bottom:8px; font-size:13.5px;}\n  .note-item .meta{font-size:11px; color:var(--ink-soft); margin-bottom:3px; font-family:'IBM Plex Mono',monospace;}\n  .add-nota-row{display:flex; gap:8px; margin-top:6px;}\n  .add-nota-row textarea{flex:1; min-height:44px; padding:8px 10px; border:1.5px solid var(--line); border-radius:7px; font-size:13.5px; font-family:'Inter',sans-serif;}\n  .time-box{background:var(--grey-bg); border-radius:8px; padding:12px; font-size:13px;}\n  .time-box .big{font-family:'IBM Plex Mono',monospace; font-size:20px; font-weight:600; color:var(--ink);}\n  .time-box .lab{color:var(--ink-soft); font-size:11.5px; text-transform:uppercase; letter-spacing:0.03em;}\n\n  .toast{\n    position:fixed; bottom:20px; left:50%; transform:translateX(-50%);\n    background:var(--ink); color:#fff; padding:10px 18px; border-radius:8px; font-size:13.5px;\n    box-shadow:0 6px 20px rgba(0,0,0,0.25); z-index:200; opacity:0; transition:opacity .2s;\n  }\n  .toast.show{opacity:1;}\n\n  footer.hint{\n    text-align:center; color:var(--ink-soft); font-size:12px; padding:18px 20px 28px;\n  }\n  @media (max-width:920px){\n    .board{grid-template-columns:1fr; }\n  }\n  @media (max-width:520px){\n    .search-box input{width:120px;}\n    .brand p{display:none;}\n    .panel{width:100%;}\n  }\n\nbody.ruolo-officina #addBtn,body.ruolo-officina #listeBtn,body.ruolo-officina #exportBtn,body.ruolo-officina #importBtn,\nbody.ruolo-vendite #addBtn,body.ruolo-vendite #listeBtn,body.ruolo-vendite #exportBtn,body.ruolo-vendite #importBtn{display:none!important}\nbody.ruolo-officina #selVenditore,body.ruolo-officina #selPriorita,body.ruolo-officina #selCausale,body.ruolo-officina #selPosizione,\nbody.ruolo-vendite #selVenditore,body.ruolo-vendite #selPriorita,body.ruolo-vendite #selCausale,body.ruolo-vendite #selPosizione{pointer-events:none;opacity:.7}\nbody.ruolo-vendite .card{cursor:pointer}\n<\/style>\n<\/head>\n<body>\n\n<header class=\"topbar\">\n  <div class=\"brand\">\n    <div class=\"badge\">\u2699<\/div>\n    <div>\n      <h1>Officina \u2014 Lavorazioni<\/h1>\n      <p>Chiappetta Auto Srl \u2014 Avanzamento vetture in officina<\/p>\n    <\/div>\n  <\/div>\n  <div class=\"topbar-actions\">\n    <div class=\"search-box\">\n      <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"white\" stroke-width=\"2\"><circle cx=\"11\" cy=\"11\" r=\"7\"/><line x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\"/><\/svg>\n      <input id=\"searchInput\" type=\"text\" placeholder=\"Cerca targa, modello o venditore...\">\n    <\/div>\n    <button class=\"btn btn-ghost btn-sm\" id=\"bellBtn\" title=\"Notifiche\" style=\"position:relative;\">\ud83d\udd14 <span class=\"bell-badge\" id=\"bellBadge\" style=\"display:none;\">0<\/span><\/button>\n    <span class=\"sync-indicator\" id=\"syncIndicator\">\u25cf Connessione...<\/span>\n    <button class=\"btn btn-ghost btn-sm\" id=\"refreshBtn\" title=\"Aggiorna ora\">\u27f3 Aggiorna<\/button>\n    <button class=\"btn btn-ghost btn-sm\" id=\"archiveBtn\" title=\"Vetture pronte da pi\u00f9 di 7 giorni\">\ud83d\udce6 Archivio <span id=\"archiveCount\">(0)<\/span><\/button>\n    <button class=\"btn btn-ghost btn-sm\" id=\"listeBtn\" title=\"Modifica gli elenchi a tendina (venditori, tipi intervento, posizioni)\">\u2699 Elenchi<\/button>\n    <button class=\"btn btn-ghost btn-sm\" id=\"exportBtn\" title=\"Scarica una copia di backup dei dati\">Backup<\/button>\n    <button class=\"btn btn-ghost btn-sm\" id=\"importBtn\" title=\"Ripristina da un file di backup\">Ripristina<\/button>\n    <input type=\"file\" id=\"importFile\" accept=\"application/json\" style=\"display:none\">\n    <button class=\"btn btn-primary\" id=\"addBtn\">+ Nuova vettura<\/button>\n  <\/div>\n<\/header>\n\n<div class=\"board-wrap\">\n  <div class=\"board\" id=\"board\"><\/div>\n<\/div>\n\n<footer class=\"hint\">Bacheca condivisa: tu e il capo officina vedete e modificate gli stessi dati aprendo questo file (anche scaricato sui vostri PC), basta avere connessione internet \u2014 nessun account necessario. Aggiornamento automatico ogni ~7 secondi, o premi \"Aggiorna\" per forzarlo.<\/footer>\n\n<div id=\"modalRoot\"><\/div>\n<div id=\"panelRoot\"><\/div>\n<div id=\"bellRoot\"><\/div>\n<div class=\"toast\" id=\"toast\"><\/div>\n\n<script>\n(function(){\n  \"use strict\";\n\n  var RUOLO = window.RUOLO || 'admin';\n  var PERMESSI = {admin:['*'], officina:['officina','nota','costi'], vendite:['nota']};\n  function puo(a){ var p=PERMESSI[RUOLO]||[]; return p.indexOf('*')>=0 || p.indexOf(a)>=0; }\n  document.body.classList.add('ruolo-'+RUOLO);\n  var FIREBASE_URL = 'https://officina-chiappetta-default-rtdb.europe-west1.firebasedatabase.app';\n  var FIREBASE_PATH = '/officina.json';\n  var LISTE_DEFAULT = {\n    venditori: ['MILIZIA','FASUOLO','SALTELLINI','GRECO','ESPOSITO','CHIMENTI','GENCARELLI','SICILIANO','OSSEQUIO'],\n    causali: [{id:'ripristino', label:'Ripristino pre-vendita'}, {id:'venduta', label:'Venduta (assistenza cliente)'}],\n    posizioni: [{id:'stock', label:'Stock'}, {id:'carrozzeria', label:'Carrozzeria'}],\n    aggiornato: 0\n  };\n  function cloneListeDefault(){ return JSON.parse(JSON.stringify(LISTE_DEFAULT)); }\n\n  // Le liste (venditori, tipi intervento, posizioni) vivono su Firebase insieme alle vetture.\n  // Firebase cancella gli array vuoti: se le liste sono state personalizzate (aggiornato > 0)\n  // un array mancante significa \"svuotato a mano\", non \"torna ai valori predefiniti\".\n  function normalizeListe(l){\n    var base = cloneListeDefault();\n    if (!l) return base;\n    var personalizzate = !!l.aggiornato;\n    ['venditori','causali','posizioni'].forEach(function(k){\n      if (Array.isArray(l[k])) base[k] = l[k].filter(Boolean);\n      else if (personalizzate) base[k] = [];\n    });\n    base.aggiornato = l.aggiornato || 0;\n    base.tariffaOraria = Number(l.tariffaOraria) || 0;\n    return base;\n  }\n  function getListe(){\n    if (!state.liste) state.liste = cloneListeDefault();\n    return state.liste;\n  }\n  function getVenditori(){ return getListe().venditori; }\n  function labelDa(lista, id){\n    for (var i=0;i<lista.length;i++){ if (lista[i].id === id) return lista[i].label; }\n    return id || '\u2014';\n  }\n  function labelCausale(id){ return labelDa(getListe().causali, id); }\n  function labelPosizione(id){ return labelDa(getListe().posizioni, id); }\n  function iconaCausale(id){ return id === 'venduta' ? '\ud83e\udd1d ' : (id === 'ripristino' ? '\ud83d\udd27 ' : '\ud83c\udff7 '); }\n  function iconaPosizione(id){ return id === 'carrozzeria' ? '\ud83c\udfa8 ' : (id === 'stock' ? '\ud83d\udce6 ' : '\ud83d\udccd '); }\n  function venditoriOpts(){ return getVenditori().map(function(n){ return {value:n, label:n}; }); }\n  function causaliOpts(){ return getListe().causali.map(function(c){ return {value:c.id, label:c.label}; }); }\n  function posizioniOpts(){ return getListe().posizioni.map(function(c){ return {value:c.id, label:c.label}; }); }\n  // Costruisce le <option>; se la vettura ha un valore non pi\u00f9 in elenco lo mantiene comunque selezionabile.\n  function optionsHtml(values, current, noneLabel){\n    var html = noneLabel ? '<option value=\"\">' + escapeHtml(noneLabel) + '<\/option>' : '';\n    var trovato = !current;\n    values.forEach(function(o){\n      if (o.value === current) trovato = true;\n      html += '<option value=\"' + escapeHtml(o.value) + '\"' + (o.value === current ? ' selected' : '') + '>' + escapeHtml(o.label) + '<\/option>';\n    });\n    if (!trovato) html += '<option value=\"' + escapeHtml(current) + '\" selected>' + escapeHtml(current) + '<\/option>';\n    return html;\n  }\n\n  var GIORNI_ARCHIVIO = 7;\n\n  var STATI = [\n    {key:'pianificare', label:'Da pianificare', color:'#6B7280', bg:'#E9EAEC'},\n    {key:'lavorazione', label:'In lavorazione', color:'#D9A226', bg:'#FBF1DC'},\n    {key:'ricambi',     label:'Attesa ricambi', color:'#D9622B', bg:'#FBE6DA'},\n    {key:'pronta',      label:'Pronta',         color:'#3E8E5B', bg:'#E1F1E7'}\n  ];\n\n  var PRIORITA_LABEL = {bassa:'Bassa', media:'Media', alta:'Alta'};\n  var PRIORITA_PESO = {bassa:1, media:2, alta:3};\n  var CAUSALE_LABEL = {ripristino:'Ripristino pre-vendita', venduta:'Venduta'};\n  var POSIZIONE_LABEL = {stock:'Stock', carrozzeria:'Carrozzeria'};\n\n  function statoInfo(key){\n    for (var i=0;i<STATI.length;i++){ if (STATI[i].key===key) return STATI[i]; }\n    return STATI[0];\n  }\n\n  function uid(){\n    return Date.now().toString(36) + Math.random().toString(36).slice(2,8);\n  }\n\n  function nowTs(){ return Date.now(); }\n\n  var modalOpen = false;\n  var lastSyncOk = null;\n  var pendingWrites = 0;\n\n  function isUiBusy(){\n    return !!openPanelId || modalOpen || pendingWrites > 0;\n  }\n\n  function updateSyncIndicator(status, when){\n    var el = document.getElementById('syncIndicator');\n    if (!el) return;\n    el.classList.remove('ok','err');\n    if (status === 'ok'){\n      el.classList.add('ok');\n      var t = when ? new Date(when).toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit',second:'2-digit'}) : '';\n      el.textContent = '\u25cf Sincronizzato ' + t;\n    } else if (status === 'err'){\n      el.classList.add('err');\n      el.textContent = '\u25cf Errore di sincronizzazione';\n    } else {\n      el.textContent = '\u25cf Connessione...';\n    }\n  }\n\n  function normalizeVettura(v){\n    // Firebase elimina i campi vuoti/null quando salva i dati (es. tempi:{inizio:null,fine:null},\n    // note:[] o lavori:[]). Li ripristiniamo qui per evitare errori in lettura.\n    if (!v.tempi) v.tempi = {};\n    if (typeof v.tempi.inizio === 'undefined') v.tempi.inizio = null;\n    if (typeof v.tempi.fine === 'undefined') v.tempi.fine = null;\n    if (!v.note) v.note = [];\n    if (!v.lavori) v.lavori = [];\n    if (typeof v.ricambiMancanti === 'undefined') v.ricambiMancanti = '';\n    if (typeof v.odlAperto === 'undefined') v.odlAperto = false;\n    if (typeof v.hcare === 'undefined') v.hcare = false;\n    if (typeof v.hcareFatto === 'undefined') v.hcareFatto = false;\n    if (!Array.isArray(v.costi)) v.costi = v.costi ? Object.keys(v.costi).map(function(k){return v.costi[k];}) : [];\n    return v;\n  }\n\n  async function fetchCloudState(){\n    try{\n      var res = await fetch(FIREBASE_URL + FIREBASE_PATH, {cache:'no-store'});\n      if (!res.ok) throw new Error('HTTP ' + res.status);\n      var data = await res.json();\n      if (data){\n        data.vetture = (data.vetture || []).map(normalizeVettura);\n        if (!data.eventi) data.eventi = [];\n        data.liste = normalizeListe(data.liste);\n        return data;\n      }\n      return { vetture: [], eventi: [], liste: cloneListeDefault() };\n    }catch(e){\n      throw e;\n    }\n  }\n\n  async function pushCloudState(){\n    pendingWrites++;\n    try{\n      var res = await fetch(FIREBASE_URL + FIREBASE_PATH, {\n        method: 'PUT',\n        headers: {'Content-Type':'application/json'},\n        body: JSON.stringify(state)\n      });\n      if (!res.ok) throw new Error('HTTP ' + res.status);\n      lastSyncOk = nowTs();\n      updateSyncIndicator('ok', lastSyncOk);\n    }catch(e){\n      console.error('Errore di sincronizzazione', e);\n      updateSyncIndicator('err');\n      showToast('Errore di sincronizzazione: la modifica resta solo su questo schermo, riprova.');\n    }finally{\n      pendingWrites--;\n    }\n  }\n\n  // Manteniamo il nome \"saveState\" cos\u00ec tutte le funzioni esistenti continuano a funzionare,\n  // ma adesso scrive sul database Firebase condiviso invece che nel browser locale.\n  function saveState(){\n    pushCloudState();\n  }\n\n  var state = { vetture: [], eventi: [], liste: cloneListeDefault() };\n  var openPanelId = null;\n  var searchTerm = '';\n  var dragVehicleId = null;\n\n  function findVettura(id){\n    for (var i=0;i<state.vetture.length;i++){\n      if (state.vetture[i].id === id) return state.vetture[i];\n    }\n    return null;\n  }\n\n  function showToast(msg){\n    var t = document.getElementById('toast');\n    t.textContent = msg;\n    t.classList.add('show');\n    setTimeout(function(){ t.classList.remove('show'); }, 1800);\n  }\n\n  function escapeHtml(s){\n    if (s === undefined || s === null) return '';\n    return String(s)\n      .replace(/&/g,'&amp;').replace(/<\/g,'&lt;').replace(/>/g,'&gt;')\n      .replace(/\"/g,'&quot;');\n  }\n\n  function formatKm(km){\n    if (km === undefined || km === null || km === '') return '\u2014';\n    var n = parseInt(km,10);\n    if (isNaN(n)) return escapeHtml(km);\n    return n.toLocaleString('it-IT') + ' km';\n  }\n\n  function formatDateTime(ts){\n    if (!ts) return '\u2014';\n    var d = new Date(ts);\n    return d.toLocaleDateString('it-IT') + ' ' + d.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});\n  }\n\n  function formatDuration(ms){\n    if (ms < 0) ms = 0;\n    var mins = Math.floor(ms / 60000);\n    var giorni = Math.floor(mins / (60*24));\n    var ore = Math.floor((mins % (60*24)) / 60);\n    var minuti = mins % 60;\n    var parts = [];\n    if (giorni > 0) parts.push(giorni + 'g');\n    if (ore > 0 || giorni > 0) parts.push(ore + 'h');\n    parts.push(minuti + 'm');\n    return parts.join(' ');\n  }\n\n  function formatGiacenza(ms){\n    if (ms < 0) ms = 0;\n    var hoursTotal = Math.floor(ms / 3600000);\n    var giorni = Math.floor(hoursTotal / 24);\n    var ore = hoursTotal % 24;\n    if (giorni > 0) return giorni + 'g ' + ore + 'h';\n    return ore + 'h';\n  }\n\n  function calcGiacenza(v){\n    var fine = (v.stato === 'pronta' && v.tempi.fine) ? v.tempi.fine : nowTs();\n    return fine - v.creato;\n  }\n\n  function isArchiviata(v){\n    if (v.stato !== 'pronta') return false;\n    if (v.archiviataManuale === true) return true;   // archiviata a mano, anche prima dei 7 giorni\n    if (v.archiviataManuale === false) return false;  // riportata in bacheca a mano, anche dopo i 7 giorni\n    return v.tempi && v.tempi.fine && (nowTs() - v.tempi.fine) > GIORNI_ARCHIVIO * 24 * 3600 * 1000;\n  }\n\n  function impostaArchiviazione(vId, val){ if(!puo('officina')) return;\n    var v = findVettura(vId);\n    if (!v) return;\n    v.archiviataManuale = val;\n    v.aggiornato = nowTs();\n    saveState();\n    render();\n  }\n\n  function lavoriProgress(v){\n    var totale = v.lavori.length;\n    var fatti = v.lavori.filter(function(l){return l.fatto;}).length;\n    return {fatti:fatti, totale:totale};\n  }\n\n  function matchesSearch(v){\n    if (!searchTerm) return true;\n    var t = searchTerm.toLowerCase();\n    return (v.targa||'').toLowerCase().indexOf(t) !== -1 ||\n           (v.tipo||'').toLowerCase().indexOf(t) !== -1 ||\n           (v.venditore||'').toLowerCase().indexOf(t) !== -1;\n  }\n\n  /* ---------------- RENDER BOARD ---------------- */\n\n  function render(){\n    var board = document.getElementById('board');\n    board.innerHTML = '';\n\n    var archiveCountEl = document.getElementById('archiveCount');\n    if (archiveCountEl){\n      var nArchiviate = state.vetture.filter(function(v){ return isArchiviata(v) && !v.cancellata; }).length;\n      archiveCountEl.textContent = '(' + nArchiviate + ')';\n    }\n    updateBellBadge();\n\n    STATI.forEach(function(stato){\n      var col = document.createElement('div');\n      col.className = 'column';\n      col.style.setProperty('--col-color', stato.color);\n      col.dataset.stato = stato.key;\n\n      var vetture = state.vetture.filter(function(v){ return v.stato === stato.key && !v.cancellata && !isArchiviata(v) && matchesSearch(v); });\n\n      var head = document.createElement('div');\n      head.className = 'column-head';\n      head.innerHTML =\n        '<div class=\"title\"><span class=\"dot\"><\/span><h2>' + escapeHtml(stato.label) + '<\/h2><\/div>' +\n        '<span class=\"count\">' + vetture.length + '<\/span>';\n      col.appendChild(head);\n\n      var body = document.createElement('div');\n      body.className = 'column-body';\n\n      if (vetture.length === 0){\n        var empty = document.createElement('div');\n        empty.className = 'empty-col';\n        empty.textContent = 'Nessuna vettura';\n        body.appendChild(empty);\n      } else {\n        vetture.sort(function(a,b){\n          var diff = (PRIORITA_PESO[b.priorita]||2) - (PRIORITA_PESO[a.priorita]||2);\n          if (diff !== 0) return diff;\n          return (b.aggiornato||b.creato) - (a.aggiornato||a.creato);\n        });\n        vetture.forEach(function(v){\n          body.appendChild(renderCard(v, stato));\n        });\n      }\n\n      col.appendChild(body);\n\n      col.addEventListener('dragover', function(e){\n        e.preventDefault();\n        col.classList.add('drag-over');\n      });\n      col.addEventListener('dragleave', function(){\n        col.classList.remove('drag-over');\n      });\n      col.addEventListener('drop', function(e){\n        e.preventDefault();\n        col.classList.remove('drag-over');\n        if (dragVehicleId){\n          cambiaStato(dragVehicleId, col.dataset.stato);\n          dragVehicleId = null;\n        }\n      });\n\n      board.appendChild(col);\n    });\n\n    renderPanel();\n  }\n\n  function renderCard(v, stato){\n    var card = document.createElement('div');\n    card.className = 'card';\n    card.style.setProperty('--col-color', stato.color);\n    card.draggable = puo('officina');\n\n    var prog = lavoriProgress(v);\n    var meta = '<span class=\"pill pill-steel\">\u23f3 ' + formatGiacenza(calcGiacenza(v)) + ' in officina<\/span>';\n\n    if (stato.key === 'lavorazione' && v.tempi.inizio){\n      meta += '<span class=\"pill pill-amber\">\u23f1 ' + formatDuration(nowTs() - v.tempi.inizio) + '<\/span>';\n    }\n    if (stato.key === 'pronta' && v.tempi.inizio && v.tempi.fine){\n      meta += '<span class=\"pill pill-green\">\u2713 ' + formatDuration(v.tempi.fine - v.tempi.inizio) + ' tot.<\/span>';\n    }\n    if (v.ricambiMancanti && v.ricambiMancanti.trim()){\n      meta += '<span class=\"pill pill-rust\">Ricambi mancanti<\/span>';\n    }\n    if (prog.totale > 0){\n      meta += '<span class=\"pill pill-grey\">' + prog.fatti + '/' + prog.totale + ' lavori<\/span>';\n    }\n\n    var notePreview = '';\n    if (v.note && v.note.length){\n      var last = v.note[v.note.length-1];\n      notePreview = '<div class=\"card-note-preview\">\"' + escapeHtml(last.testo) + '\"<\/div>';\n    }\n\n    card.innerHTML =\n      '<button class=\"card-del\" title=\"Elimina vettura\" data-id=\"' + v.id + '\">\u2715<\/button>' +\n      '<div class=\"card-top\">' +\n        '<div class=\"targa\"><span class=\"strip\">I<\/span><span class=\"code\">' + escapeHtml(v.targa || '\u2014') + '<\/span><\/div>' +\n        '<span class=\"priority-badge priority-' + v.priorita + '\">' + PRIORITA_LABEL[v.priorita] + '<\/span>' +\n      '<\/div>' +\n      '<div class=\"card-tipo\">' + escapeHtml(v.tipo || 'Veicolo') + '<\/div>' +\n      '<div class=\"card-km mono\">' + formatKm(v.km) + '<\/div>' +\n      (v.venditore ? '<div class=\"card-km\" style=\"color:var(--steel-dark); font-weight:600; font-family:Inter,sans-serif; font-size:11.5px; margin-top:3px;\">\ud83d\udc64 ' + escapeHtml(v.venditore) + '<\/div>' : '') +\n      '<div class=\"tag-row\">' +\n        '<span class=\"pill ' + (v.causale === 'venduta' ? 'pill-tag-blue' : 'pill-tag-purple') + '\">' + iconaCausale(v.causale) + escapeHtml(labelCausale(v.causale)) + '<\/span>' +\n        '<span class=\"pill ' + (v.posizione === 'carrozzeria' ? 'pill-tag-copper' : 'pill-grey') + '\">' + iconaPosizione(v.posizione) + escapeHtml(labelPosizione(v.posizione)) + '<\/span>' +\n        '<span class=\"pill ' + (v.odlAperto ? 'pill-odl-yes' : 'pill-odl-no') + '\">' + (v.odlAperto ? '\ud83d\udcc4 ODL aperto' : '\u26a0 ODL non aperto') + '<\/span>' +\n        (v.hcare ? '<span class=\"pill ' + (v.hcareFatto ? 'pill-hcare-done' : 'pill-hcare') + '\">' + (v.hcareFatto ? '\ud83d\udd0b H-Care \u2713' : '\ud83d\udd0b H-Care richiesto') + '<\/span>' : '') +\n      '<\/div>' +\n      '<div class=\"card-meta\">' + meta + '<\/div>' +\n      notePreview;\n\n    card.addEventListener('click', function(e){\n      if (e.target.closest('.card-del')) return;\n      openPanel(v.id);\n    });\n\n    card.querySelector('.card-del').addEventListener('click', function(e){\n      e.stopPropagation();\n      eliminaVettura(v.id);\n    });\n\n    card.addEventListener('dragstart', function(){\n      dragVehicleId = v.id;\n      card.classList.add('dragging');\n    });\n    card.addEventListener('dragend', function(){\n      card.classList.remove('dragging');\n    });\n\n    return card;\n  }\n\n  /* ---------------- AZIONI SUI DATI ---------------- */\n\n  function creaEvento(vId, tipo, testo){\n    var v = findVettura(vId);\n    if (!state.eventi) state.eventi = [];\n    state.eventi.unshift({\n      id: uid(),\n      vehicleId: vId,\n      vehicleTarga: v ? v.targa : '',\n      vehicleTipo: v ? v.tipo : '',\n      tipo: tipo, // 'stato' | 'nota'\n      testo: testo,\n      data: nowTs()\n    });\n    if (state.eventi.length > 200) state.eventi = state.eventi.slice(0, 200);\n  }\n\n  function cambiaStato(id, nuovoStato){ if(!puo('officina')) return;\n    var v = findVettura(id);\n    if (!v || v.stato === nuovoStato) return;\n    var statoVecchio = statoInfo(v.stato).label;\n    v.stato = nuovoStato;\n    v.aggiornato = nowTs();\n    v.archiviataManuale = null; // si ricalcola da capo ad ogni cambio di stato\n    if (nuovoStato === 'lavorazione' && !v.tempi.inizio){\n      v.tempi.inizio = nowTs();\n    }\n    if (nuovoStato === 'pronta' && v.tempi.inizio && !v.tempi.fine){\n      v.tempi.fine = nowTs();\n    }\n    if (nuovoStato !== 'pronta'){\n      v.tempi.fine = null;\n    }\n    creaEvento(id, 'stato', statoVecchio + ' \u2192 ' + statoInfo(nuovoStato).label);\n    saveState();\n    render();\n  }\n\n  function eliminaVettura(id){ if(!puo('admin')) return;\n    var v = findVettura(id);\n    if (!v) return;\n    if (!confirm('Eliminare la vettura ' + (v.targa || '') + ' (' + (v.tipo || '') + ')? Operazione non reversibile.')) return;\n    v.cancellata = true;\n    v.aggiornato = nowTs();\n    saveState();\n    if (openPanelId === id) closePanel();\n    render();\n    showToast('Vettura eliminata');\n  }\n\n  function aggiungiVettura(data){ if(!puo('admin')) return;\n    var v = {\n      id: uid(),\n      tipo: data.tipo,\n      targa: data.targa.toUpperCase(),\n      km: data.km,\n      stato: 'pianificare',\n      priorita: data.priorita || 'media',\n      causale: data.causale || 'ripristino',\n      posizione: data.posizione || 'stock',\n      venditore: data.venditore || '',\n      odlAperto: !!data.odlAperto,\n      hcare: !!data.hcare,\n      hcareFatto: false,\n      lavori: data.lavori.map(function(testo){ return {id: uid(), testo: testo, fatto:false}; }),\n      ricambiMancanti: '',\n      note: [],\n      tempi: {inizio:null, fine:null},\n      creato: nowTs(),\n      aggiornato: nowTs()\n    };\n    state.vetture.push(v);\n    saveState();\n    render();\n    showToast('Vettura aggiunta alla bacheca');\n  }\n\n  function toggleLavoro(vId, lavoroId){ if(!puo('officina')) return;\n    var v = findVettura(vId);\n    if (!v) return;\n    var l = v.lavori.find(function(x){ return x.id === lavoroId; });\n    if (!l) return;\n    l.fatto = !l.fatto;\n    v.aggiornato = nowTs();\n    saveState();\n    render();\n  }\n\n  function rimuoviLavoro(vId, lavoroId){ if(!puo('officina')) return;\n    var v = findVettura(vId);\n    if (!v) return;\n    v.lavori = v.lavori.filter(function(x){ return x.id !== lavoroId; });\n    v.aggiornato = nowTs();\n    saveState();\n    render();\n  }\n\n  function aggiungiLavoro(vId, testo){ if(!puo('officina')) return;\n    testo = (testo||'').trim();\n    if (!testo) return;\n    var v = findVettura(vId);\n    if (!v) return;\n    v.lavori.push({id:uid(), testo:testo, fatto:false});\n    v.aggiornato = nowTs();\n    saveState();\n    render();\n  }\n\n\n  // ===== COSTI RIPRISTINO (preventivi, ricambi, manodopera) =====\n  function tariffaOraria(){ return Number(getListe().tariffaOraria) || 0; }\n  function eur(n){ return (Number(n)||0).toLocaleString('it-IT',{minimumFractionDigits:2,maximumFractionDigits:2}) + ' \u20ac'; }\n  function totaliCosti(v){\n    var t = {ricambi:0, manodopera:0, totale:0};\n    (v.costi||[]).forEach(function(c){\n      var i = Number(c.importo)||0;\n      if (c.tipo === 'manodopera') t.manodopera += i; else t.ricambi += i;\n      t.totale += i;\n    });\n    return t;\n  }\n  function aggiungiCosto(vId, voce){ if(!puo('costi')) return;\n    var v = findVettura(vId); if (!v) return;\n    if (!v.costi) v.costi = [];\n    voce.id = uid();\n    v.costi.push(voce);\n    v.aggiornato = nowTs();\n    saveState(); render();\n  }\n  function rimuoviCosto(vId, cId){ if(!puo('costi')) return;\n    var v = findVettura(vId); if (!v) return;\n    if (!v.costi) v.costi = [];\n    v.costi = v.costi.filter(function(c){ return c.id !== cId; });\n    v.aggiornato = nowTs();\n    saveState(); render();\n  }\n  function parseImporto(t){\n    t = String(t||'').replace(/[\u20ac\\s]/g,'');\n    if (!t) return NaN;\n    if (/,/.test(t)) t = t.replace(/\\./g,'').replace(',','.');\n    return parseFloat(t);\n  }\n  function caricaPdfJs(){\n    if (window.pdfjsLib) return Promise.resolve(window.pdfjsLib);\n    return new Promise(function(res, rej){\n      var sc = document.createElement('script');\n      sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';\n      sc.onload = function(){\n        window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';\n        res(window.pdfjsLib);\n      };\n      sc.onerror = function(){ rej(new Error('pdf.js non raggiungibile')); };\n      document.head.appendChild(sc);\n    });\n  }\n  async function righeDaPdf(file){\n    var lib = await caricaPdfJs();\n    var buf = await file.arrayBuffer();\n    var pdf = await lib.getDocument({data:buf}).promise;\n    var righe = [];\n    for (var p = 1; p <= pdf.numPages; p++){\n      var page = await pdf.getPage(p);\n      var tc = await page.getTextContent();\n      var linee = {};\n      tc.items.forEach(function(it){\n        var y = Math.round(it.transform[5] / 3);\n        (linee[y] = linee[y] || []).push({x: it.transform[4], t: it.str});\n      });\n      Object.keys(linee).map(Number).sort(function(a,b){return b-a;}).forEach(function(y){\n        var testo = linee[y].sort(function(a,b){return a.x-b.x;}).map(function(i){return i.t;}).join(' ').replace(/\\s+/g,' ').trim();\n        if (testo) righe.push(testo);\n      });\n    }\n    var out = [];\n    righe.forEach(function(r){\n      var m = r.match(/(\\d{1,3}(?:\\.\\d{3})*,\\d{2})(?!.*\\d{1,3}(?:\\.\\d{3})*,\\d{2})/);\n      if (!m) return;\n      var imp = parseImporto(m[1]);\n      if (!(imp > 0)) return;\n      var desc = r.replace(/(\\d{1,3}(?:\\.\\d{3})*,\\d{2}\\s*\u20ac?\\s*)+/g,' ').replace(/\\s+/g,' ').trim();\n      if (!desc) desc = 'Voce da PDF';\n      var tot = /totale|imponibile|iva|netto|da pagare|acconto|sconto/i.test(r);\n      out.push({desc: desc.slice(0,90), importo: imp, totale: tot});\n    });\n    return out;\n  }\n  function apriPdfCosti(vId, file){\n    var root = document.getElementById('modalRoot');\n    modalOpen = true;\n    root.innerHTML = '<div class=\"overlay\"><div class=\"modal\" style=\"max-width:640px;\"><div class=\"modal-head\"><h2>Lettura PDF\u2026<\/h2><\/div><div class=\"modal-body\">Sto leggendo \u00ab' + escapeHtml(file.name) + '\u00bb\u2026<\/div><\/div><\/div>';\n    function chiudi(){ root.innerHTML=''; modalOpen=false; render(); }\n    righeDaPdf(file).then(function(righe){\n      if (!righe.length){\n        root.innerHTML = '<div class=\"overlay\"><div class=\"modal\" style=\"max-width:520px;\"><div class=\"modal-head\"><h2>Nessuna voce trovata<\/h2><button class=\"modal-close\" id=\"pdfX\">&times;<\/button><\/div><div class=\"modal-body\">Non sono riuscito a leggere importi in questo PDF (potrebbe essere una scansione/immagine). Inserisci le voci a mano.<\/div><div class=\"modal-foot\"><button class=\"btn btn-primary\" id=\"pdfOk\">Ok<\/button><\/div><\/div><\/div>';\n        document.getElementById('pdfX').onclick = chiudi; document.getElementById('pdfOk').onclick = chiudi;\n        return;\n      }\n      var rows = righe.map(function(r,i){\n        return '<tr><td><input type=\"checkbox\" data-i=\"'+i+'\" '+(r.totale?'':'checked')+'><\/td>' +\n          '<td><input type=\"text\" class=\"pdfDesc\" data-i=\"'+i+'\" value=\"'+escapeHtml(r.desc)+'\" style=\"width:100%\"><\/td>' +\n          '<td><input type=\"text\" class=\"pdfImp\" data-i=\"'+i+'\" value=\"'+String(r.importo).replace('.',',')+'\" style=\"width:90px;text-align:right\"><\/td><\/tr>';\n      }).join('');\n      root.innerHTML = '<div class=\"overlay\"><div class=\"modal\" style=\"max-width:680px;\"><div class=\"modal-head\"><h2>Voci trovate nel PDF<\/h2><button class=\"modal-close\" id=\"pdfX\">&times;<\/button><\/div>' +\n        '<div class=\"modal-body\"><div style=\"font-size:12.5px;color:var(--ink-soft);margin-bottom:8px;\">Spunta le voci da aggiungere ai costi di ripristino. Le righe di totale/IVA/sconto sono gi\u00e0 escluse: controlla importi e descrizioni prima di confermare. Il PDF non viene salvato.<\/div>' +\n        '<table style=\"width:100%;border-collapse:collapse;\">' + rows + '<\/table>' +\n        '<div style=\"margin-top:10px;font-weight:600;\">Totale selezionato: <span id=\"pdfTot\">0,00 \u20ac<\/span><\/div><\/div>' +\n        '<div class=\"modal-foot\"><button class=\"btn btn-outline\" id=\"pdfAnnulla\">Annulla<\/button> <button class=\"btn btn-primary\" id=\"pdfConf\">Aggiungi selezionate<\/button><\/div><\/div><\/div>';\n      function calc(){\n        var t = 0;\n        root.querySelectorAll('input[type=checkbox]').forEach(function(cb){\n          if (!cb.checked) return;\n          var v = parseImporto(root.querySelector('.pdfImp[data-i=\"'+cb.dataset.i+'\"]').value);\n          if (v > 0) t += v;\n        });\n        document.getElementById('pdfTot').textContent = eur(t);\n      }\n      root.addEventListener('input', calc); root.addEventListener('change', calc); calc();\n      document.getElementById('pdfX').onclick = chiudi; document.getElementById('pdfAnnulla').onclick = chiudi;\n      document.getElementById('pdfConf').onclick = function(){\n        var v = findVettura(vId); if (!v){ chiudi(); return; }\n        var n = 0;\n        root.querySelectorAll('input[type=checkbox]').forEach(function(cb){\n          if (!cb.checked) return;\n          var i = cb.dataset.i;\n          var imp = parseImporto(root.querySelector('.pdfImp[data-i=\"'+i+'\"]').value);\n          var d = root.querySelector('.pdfDesc[data-i=\"'+i+'\"]').value.trim() || 'Voce da PDF';\n          if (!(imp > 0)) return;\n          v.costi.push({id: uid(), tipo:'ricambi', desc: d, importo: imp, fonte:'pdf'}); n++;\n        });\n        if (n){ v.aggiornato = nowTs(); saveState(); }\n        showToast(n + (n===1?' voce aggiunta':' voci aggiunte'));\n        chiudi();\n      };\n    }).catch(function(err){\n      root.innerHTML = '<div class=\"overlay\"><div class=\"modal\" style=\"max-width:520px;\"><div class=\"modal-head\"><h2>PDF non letto<\/h2><button class=\"modal-close\" id=\"pdfX\">&times;<\/button><\/div><div class=\"modal-body\">'+escapeHtml(err.message||'Errore')+'. Controlla la connessione oppure inserisci le voci a mano.<\/div><div class=\"modal-foot\"><button class=\"btn btn-primary\" id=\"pdfOk\">Ok<\/button><\/div><\/div><\/div>';\n      document.getElementById('pdfX').onclick = chiudi; document.getElementById('pdfOk').onclick = chiudi;\n    });\n  }\n\n  function impostaPriorita(vId, val){ if(!puo('admin')) return;\n    var v = findVettura(vId);\n    if (!v) return;\n    v.priorita = val;\n    v.aggiornato = nowTs();\n    saveState();\n    render();\n  }\n\n  function impostaCausale(vId, val){ if(!puo('admin')) return;\n    var v = findVettura(vId);\n    if (!v) return;\n    v.causale = val;\n    v.aggiornato = nowTs();\n    saveState();\n    render();\n  }\n\n  function impostaPosizione(vId, val){ if(!puo('admin')) return;\n    var v = findVettura(vId);\n    if (!v) return;\n    v.posizione = val;\n    v.aggiornato = nowTs();\n    saveState();\n    render();\n  }\n\n  function impostaVenditore(vId, val){ if(!puo('admin')) return;\n    var v = findVettura(vId);\n    if (!v) return;\n    v.venditore = val;\n    v.aggiornato = nowTs();\n    saveState();\n    render();\n  }\n\n  function impostaOdl(vId, val){ if(!puo('officina')) return;\n    var v = findVettura(vId);\n    if (!v) return;\n    v.odlAperto = val;\n    v.aggiornato = nowTs();\n    saveState();\n    render();\n  }\n\n  function impostaHcare(vId, val){ if(!puo('officina')) return;\n    var v = findVettura(vId);\n    if (!v) return;\n    v.hcare = val;\n    if (val) { v.hcareRichiestoPer = nowTs(); } else { v.hcareRichiestoPer = null; v.hcareFatto = false; }\n    v.aggiornato = nowTs();\n    saveState();\n    render();\n    creaEvento(vId, 'stato', val ? 'H-Care richiesto (batteria sostituita, ritorno a 500km)' : 'H-Care rimosso');\n  }\n\n  function impostaHcareFatto(vId, val){ if(!puo('officina')) return;\n    var v = findVettura(vId);\n    if (!v) return;\n    v.hcareFatto = val;\n    v.hcarefattoData = val ? nowTs() : null;\n    v.aggiornato = nowTs();\n    saveState();\n    render();\n    if (val) creaEvento(vId, 'stato', 'H-Care completato \u2713');\n  }\n\n  function impostaRicambi(vId, testo){ if(!puo('officina')) return;\n    var v = findVettura(vId);\n    if (!v) return;\n    v.ricambiMancanti = testo;\n    v.aggiornato = nowTs();\n    saveState();\n  }\n\n  function aggiungiNota(vId, testo){ if(!puo('nota')) return;\n    testo = (testo||'').trim();\n    if (!testo) return;\n    var v = findVettura(vId);\n    if (!v) return;\n    v.note.push({testo:testo, data:nowTs()});\n    v.aggiornato = nowTs();\n    creaEvento(vId, 'nota', testo);\n    saveState();\n    render();\n  }\n\n  /* ---------------- MODALE NUOVA VETTURA ---------------- */\n\n  var tempLavori = [];\n\n  /* ---------------- CENTRO NOTIFICHE ---------------- */\n\n  var LETTI_KEY = 'officina_notifiche_lette_v1';\n\n  function getLettiIds(){\n    try{\n      var raw = localStorage.getItem(LETTI_KEY);\n      return raw ? JSON.parse(raw) : [];\n    }catch(e){ return []; }\n  }\n  function setLettiIds(ids){\n    try{ localStorage.setItem(LETTI_KEY, JSON.stringify(ids)); }catch(e){}\n  }\n  function isLetto(eventoId){\n    return getLettiIds().indexOf(eventoId) !== -1;\n  }\n  function segnaLetto(eventoId){\n    var ids = getLettiIds();\n    if (ids.indexOf(eventoId) === -1){\n      ids.push(eventoId);\n      if (ids.length > 400) ids = ids.slice(ids.length - 400); // non far crescere all'infinito\n      setLettiIds(ids);\n    }\n  }\n  function segnaTuttiLetti(){\n    var ids = getLettiIds();\n    (state.eventi||[]).forEach(function(ev){\n      if (ids.indexOf(ev.id) === -1) ids.push(ev.id);\n    });\n    setLettiIds(ids);\n  }\n\n  function timeAgo(ts){\n    var diff = nowTs() - ts;\n    var mins = Math.floor(diff / 60000);\n    if (mins < 1) return 'ora';\n    if (mins < 60) return mins + 'm fa';\n    var ore = Math.floor(mins / 60);\n    if (ore < 24) return ore + 'h fa';\n    var giorni = Math.floor(ore / 24);\n    return giorni + 'g fa';\n  }\n\n  function updateBellBadge(){\n    var badge = document.getElementById('bellBadge');\n    if (!badge) return;\n    var lettiIds = getLettiIds();\n    var nonLetti = (state.eventi||[]).filter(function(ev){ return lettiIds.indexOf(ev.id) === -1; }).length;\n    if (nonLetti > 0){\n      badge.style.display = 'flex';\n      badge.textContent = nonLetti > 99 ? '99+' : nonLetti;\n    } else {\n      badge.style.display = 'none';\n    }\n  }\n\n  function toggleBellDropdown(){\n    var root = document.getElementById('bellRoot');\n    if (root.innerHTML){\n      root.innerHTML = '';\n      return;\n    }\n    var lettiIds = getLettiIds();\n    var eventi = (state.eventi||[]).slice(0, 50);\n\n    var btn = document.getElementById('bellBtn');\n    var rect = btn.getBoundingClientRect();\n    var top = rect.bottom + 8;\n    var left = Math.min(rect.left, window.innerWidth - 340 - 16);\n\n    var items = eventi.map(function(ev){\n      var letto = lettiIds.indexOf(ev.id) !== -1;\n      var icona = ev.tipo === 'nota' ? '\ud83d\udcac' : '\ud83d\udd04';\n      return '<div class=\"bell-item ' + (letto?'':'unread') + '\" data-eid=\"' + ev.id + '\" data-vid=\"' + ev.vehicleId + '\">' +\n        '<div class=\"' + (letto?'dot-read':'dot-unread') + '\"><\/div>' +\n        '<div class=\"body\">' +\n          '<div class=\"top\"><span class=\"targa-mini\">' + icona + ' ' + escapeHtml(ev.vehicleTarga||'\u2014') + ' \u00b7 ' + escapeHtml(ev.vehicleTipo||'') + '<\/span><span class=\"time\">' + timeAgo(ev.data) + '<\/span><\/div>' +\n          '<div class=\"testo\">' + escapeHtml(ev.testo) + '<\/div>' +\n        '<\/div>' +\n      '<\/div>';\n    }).join('') || '<div class=\"bell-empty\">Nessuna notifica ancora.<br>Qui vedrai i cambi di stato e le note lasciate sulle vetture.<\/div>';\n\n    root.innerHTML =\n      '<div class=\"bell-dropdown\" style=\"top:' + top + 'px; left:' + left + 'px;\">' +\n        '<div class=\"bell-dropdown-head\"><h3>Notifiche<\/h3><button class=\"btn btn-outline btn-sm\" id=\"segnaTuttiBtn\">Segna tutte come lette<\/button><\/div>' +\n        items +\n      '<\/div>';\n\n    document.getElementById('segnaTuttiBtn').addEventListener('click', function(e){\n      e.stopPropagation();\n      segnaTuttiLetti();\n      updateBellBadge();\n      root.innerHTML = '';\n    });\n\n    root.querySelectorAll('.bell-item').forEach(function(item){\n      item.addEventListener('click', function(){\n        segnaLetto(item.dataset.eid);\n        updateBellBadge();\n        root.innerHTML = '';\n        openPanel(item.dataset.vid);\n      });\n    });\n  }\n\n  document.addEventListener('click', function(e){\n    var root = document.getElementById('bellRoot');\n    if (!root || !root.innerHTML) return;\n    if (e.target.closest('#bellRoot') || e.target.closest('#bellBtn')) return;\n    root.innerHTML = '';\n  });\n\n  function openArchivio(){\n    var root = document.getElementById('modalRoot');\n    var tutte = state.vetture.filter(function(v){ return isArchiviata(v) && !v.cancellata; });\n    tutte.sort(function(a,b){ return ((b.tempi && b.tempi.fine)||0) - ((a.tempi && a.tempi.fine)||0); });\n\n    root.innerHTML =\n      '<div class=\"overlay\" id=\"archiveOverlay\">' +\n        '<div class=\"modal\" style=\"max-width:560px;\">' +\n          '<div class=\"modal-head\"><h2>Archivio vetture pronte<\/h2><button class=\"modal-close\" id=\"closeArchive\">&times;<\/button><\/div>' +\n          '<div class=\"modal-body\">' +\n            '<input type=\"text\" id=\"archSearch\" class=\"archive-search\" placeholder=\"Cerca per targa, modello o venditore...\" value=\"' + escapeHtml(searchTerm || '') + '\" autocomplete=\"off\">' +\n            '<div class=\"archive-count\" id=\"archCount\"><\/div>' +\n            '<div id=\"archList\"><\/div>' +\n          '<\/div>' +\n        '<\/div>' +\n      '<\/div>';\n\n    // confronto \"morbido\": ignora maiuscole, spazi, trattini e punti (cos\u00ec \"ab 123 cd\" trova AB123CD)\n    function norm(x){ return (x === undefined || x === null ? '' : String(x)).toLowerCase().replace(/[\\s\\-\\.]/g, ''); }\n\n    function drawList(){\n      var t = norm(document.getElementById('archSearch').value);\n      var lista = tutte.filter(function(v){\n        return !t || norm(v.targa).indexOf(t) !== -1 || norm(v.tipo).indexOf(t) !== -1 || norm(v.venditore).indexOf(t) !== -1;\n      });\n      document.getElementById('archCount').textContent = tutte.length\n        ? (t ? lista.length + ' trovate su ' + tutte.length + ' in archivio' : tutte.length + ' vetture in archivio')\n        : '';\n      var html = lista.map(function(v){\n        var fine = v.tempi && v.tempi.fine;\n        var giorniPronta = fine ? Math.floor((nowTs() - fine) / (24*3600*1000)) : 0;\n        return '<div class=\"archive-row\" data-id=\"' + v.id + '\">' +\n          '<div class=\"targa\"><span class=\"strip\">I<\/span><span class=\"code\">' + escapeHtml(v.targa) + '<\/span><\/div>' +\n          '<div class=\"info\">' +\n            '<div class=\"nome\">' + escapeHtml(v.tipo) + '<\/div>' +\n            '<div class=\"sub\">Pronta da ' + giorniPronta + ' giorni \u00b7 ' + formatDateTime(fine) + (v.venditore ? ' \u00b7 ' + escapeHtml(v.venditore) : '') + '<\/div>' +\n          '<\/div>' +\n        '<\/div>';\n      }).join('');\n      if (!html){\n        html = tutte.length\n          ? '<div class=\"archive-empty\">Nessuna vettura trovata con questa ricerca.<\/div>'\n          : '<div class=\"archive-empty\">Ancora nessuna vettura archiviata.<br>Le vetture \"Pronta\" da pi\u00f9 di ' + GIORNI_ARCHIVIO + ' giorni finiscono qui automaticamente.<\/div>';\n      }\n      document.getElementById('archList').innerHTML = html;\n    }\n\n    function close(){ root.innerHTML = ''; }\n    document.getElementById('closeArchive').addEventListener('click', close);\n    document.getElementById('archiveOverlay').addEventListener('click', function(e){\n      if (e.target.id === 'archiveOverlay') close();\n    });\n    document.getElementById('archSearch').addEventListener('input', drawList);\n    document.getElementById('archList').addEventListener('click', function(e){\n      var row = e.target.closest('.archive-row');\n      if (!row) return;\n      close();\n      openPanel(row.dataset.id);\n    });\n    drawList();\n    setTimeout(function(){ var i = document.getElementById('archSearch'); if (i){ i.focus(); i.select(); } }, 50);\n  }\n\n  function openListe(){ if(!puo('admin')) return;\n    var root = document.getElementById('modalRoot');\n    modalOpen = true;\n\n    var SEZIONI = [\n      {key:'venditori', titolo:'Venditori', hint:'Compaiono nella tendina \"Venditore\" e nel filtro del file consegne.', placeholder:'Nome venditore (es. ROSSI)'},\n      {key:'causali',   titolo:'Tipo intervento', hint:'Compaiono nella tendina \"Tipo intervento\" di ogni vettura.', placeholder:'es. Garanzia, Reso, Permuta...'},\n      {key:'posizioni', titolo:'Posizione vettura', hint:'Compaiono nella tendina \"Posizione vettura\" di ogni vettura.', placeholder:'es. Piazzale, Lavaggio, Altra sede...'}\n    ];\n\n    function items(key){\n      return getListe()[key].map(function(x){\n        return (typeof x === 'string') ? {id:x, label:x} : {id:x.id, label:x.label};\n      });\n    }\n    function usate(key, id){\n      return state.vetture.filter(function(v){\n        if (v.cancellata) return false;\n        if (key === 'venditori') return v.venditore === id;\n        if (key === 'causali') return v.causale === id;\n        return v.posizione === id;\n      }).length;\n    }\n    function salva(){\n      getListe().aggiornato = nowTs();\n      saveState();\n    }\n    function chiudi(){\n      root.innerHTML = '';\n      modalOpen = false;\n      render();\n      syncNowIfIdle();\n    }\n\n    function draw(focusKey){\n      var body = SEZIONI.map(function(sz){\n        var chips = items(sz.key).map(function(it, i){\n          return '<span class=\"lchip\">' + escapeHtml(it.label) + '<button data-rm=\"' + sz.key + '\" data-i=\"' + i + '\" title=\"Rimuovi\">\u2715<\/button><\/span>';\n        }).join('') || '<span style=\"font-size:12.5px; color:var(--ink-soft);\">Nessuna voce.<\/span>';\n        return '<div class=\"liste-sez\">' +\n          '<h3>' + sz.titolo + '<\/h3>' +\n          '<div class=\"hint\">' + sz.hint + '<\/div>' +\n          '<div class=\"liste-chips\">' + chips + '<\/div>' +\n          '<div class=\"liste-add\"><input type=\"text\" id=\"add_' + sz.key + '\" placeholder=\"' + sz.placeholder + '\" autocomplete=\"off\">' +\n          '<button class=\"btn btn-outline btn-sm\" data-add=\"' + sz.key + '\">+ Aggiungi<\/button><\/div>' +\n        '<\/div>';\n      }).join('');\n\n      var tariffaHtml = '<div class=\"liste-sez\"><h3>Manodopera<\/h3><div class=\"hint\">Costo orario usato dal capo officina per calcolare la manodopera nei costi di ripristino.<\/div>' +\n        '<div class=\"liste-add\"><input type=\"text\" id=\"tariffaInput\" inputmode=\"decimal\" value=\"' + String(tariffaOraria()||'').replace('.',',') + '\" placeholder=\"\u20ac all\\'ora (es. 38)\"><button class=\"btn btn-outline btn-sm\" id=\"tariffaSave\">Salva<\/button><\/div><\/div>';\n      root.innerHTML =\n        '<div class=\"overlay\" id=\"listeOverlay\">' +\n          '<div class=\"modal\" style=\"max-width:560px;\">' +\n            '<div class=\"modal-head\"><h2>Modifica elenchi<\/h2><button class=\"modal-close\" id=\"closeListe\">&times;<\/button><\/div>' +\n            '<div class=\"modal-body\">' + body + tariffaHtml +\n              '<div style=\"font-size:12px; color:var(--ink-soft);\">Le modifiche si salvano subito e valgono per tutti (anche nel file consegne). La priorit\u00e0 (Bassa/Media/Alta) resta fissa perch\u00e9 ordina le vetture in bacheca.<\/div>' +\n            '<\/div>' +\n            '<div class=\"modal-foot\"><button class=\"btn btn-primary\" id=\"doneListe\">Fatto<\/button><\/div>' +\n          '<\/div>' +\n        '<\/div>';\n\n      document.getElementById('tariffaSave').addEventListener('click', function(){\n        var n = parseImporto(document.getElementById('tariffaInput').value);\n        if (isNaN(n) || n < 0){ showToast('Importo non valido'); return; }\n        getListe().tariffaOraria = n; salva(); showToast('Tariffa salvata: ' + eur(n) + '/h');\n      });\n      document.getElementById('closeListe').addEventListener('click', chiudi);\n      document.getElementById('doneListe').addEventListener('click', chiudi);\n      document.getElementById('listeOverlay').addEventListener('click', function(e){ if (e.target.id === 'listeOverlay') chiudi(); });\n\n      root.querySelectorAll('[data-add]').forEach(function(btn){\n        function aggiungi(){\n          var key = btn.dataset.add;\n          var input = document.getElementById('add_' + key);\n          var val = input.value.trim();\n          if (key === 'venditori') val = val.toUpperCase();\n          if (!val) return;\n          var esiste = items(key).some(function(it){ return it.label.toLowerCase() === val.toLowerCase(); });\n          if (esiste){ showToast('\"' + val + '\" \u00e8 gi\u00e0 presente'); return; }\n          if (key === 'venditori') getListe()[key].push(val);\n          else getListe()[key].push({id:val, label:val});\n          salva();\n          draw(key);\n        }\n        btn.addEventListener('click', aggiungi);\n        document.getElementById('add_' + btn.dataset.add).addEventListener('keydown', function(e){\n          if (e.key === 'Enter'){ e.preventDefault(); aggiungi(); }\n        });\n      });\n\n      root.querySelectorAll('[data-rm]').forEach(function(btn){\n        btn.addEventListener('click', function(){\n          var key = btn.dataset.rm;\n          var it = items(key)[parseInt(btn.dataset.i, 10)];\n          if (!it) return;\n          var n = usate(key, it.id);\n          var msg = n\n            ? '\"' + it.label + '\" \u00e8 usato da ' + n + (n === 1 ? ' vettura' : ' vetture') + '. Le vetture lo conserveranno, ma non comparir\u00e0 pi\u00f9 nell\\'elenco per le nuove scelte. Rimuoverlo?'\n            : 'Rimuovere \"' + it.label + '\" dall\\'elenco?';\n          if (!confirm(msg)) return;\n          getListe()[key].splice(parseInt(btn.dataset.i, 10), 1);\n          salva();\n          draw(key);\n        });\n      });\n\n      if (focusKey){ var f = document.getElementById('add_' + focusKey); if (f) f.focus(); }\n    }\n\n    draw();\n  }\n\n  function openAddModal(){ if(!puo('admin')) return;\n    tempLavori = [];\n    modalOpen = true;\n    var root = document.getElementById('modalRoot');\n    root.innerHTML =\n      '<div class=\"overlay\" id=\"addOverlay\">' +\n        '<div class=\"modal\">' +\n          '<div class=\"modal-head\"><h2>Nuova vettura<\/h2><button class=\"modal-close\" id=\"closeAdd\">&times;<\/button><\/div>' +\n          '<div class=\"modal-body\">' +\n            '<div class=\"field\"><label>Tipo veicolo (marca / modello)<\/label><input id=\"fTipo\" type=\"text\" placeholder=\"es. Toyota Yaris Hybrid\"><\/div>' +\n            '<div class=\"field\"><label>Targa<\/label><input id=\"fTarga\" class=\"mono\" type=\"text\" placeholder=\"AB123CD\" maxlength=\"10\"><\/div>' +\n            '<div class=\"field\"><label>Chilometri<\/label><input id=\"fKm\" type=\"number\" min=\"0\" placeholder=\"es. 54000\"><\/div>' +\n            '<div class=\"field\"><label>Venditore<\/label><select id=\"fVenditore\">' + optionsHtml(venditoriOpts(), '', '\u2014 Nessuno \u2014') + '<\/select><\/div>' +\n            '<div class=\"field\"><label>Priorit\u00e0<\/label><select id=\"fPriorita\">' +\n              '<option value=\"bassa\">Bassa<\/option><option value=\"media\" selected>Media<\/option><option value=\"alta\">Alta<\/option>' +\n            '<\/select><\/div>' +\n            '<div class=\"field\"><label>Tipo intervento<\/label><select id=\"fCausale\">' + optionsHtml(causaliOpts(), '', '') + '<\/select><\/div>' +\n            '<div class=\"field\"><label>Posizione vettura<\/label><select id=\"fPosizione\">' + optionsHtml(posizioniOpts(), '', '') + '<\/select><\/div>' +\n            '<div class=\"field\"><label style=\"display:flex; align-items:center; gap:8px; cursor:pointer; text-transform:none; font-size:13.5px;\"><input type=\"checkbox\" id=\"fOdl\" style=\"width:16px; height:16px; accent-color:var(--steel);\"> Ordine di lavoro (ODL) gi\u00e0 aperto<\/label><\/div>' +\n            '<div class=\"field\"><label style=\"display:flex; align-items:center; gap:8px; cursor:pointer; text-transform:none; font-size:13.5px;\"><input type=\"checkbox\" id=\"fHcare\" style=\"width:16px; height:16px; accent-color:#6B21A8;\"> \ud83d\udd0b H-Care richiesto (batteria sostituita \u2014 ritorno a 500km)<\/label><\/div>' +\n            '<div class=\"field\">' +\n              '<label>Lavori da eff ('click', close);\n    document.getElementById('addOverlay').addEventListener('click', function(e){\n      if (e.target.id === 'addOverlay') close();\n    });\n\n    document.getElementById('confirmAdd').addEventListener('click', function(){\n      var tipo = document.getElementById('fTipo').value.trim();\n      var targa = document.getElementById('fTarga').value.trim();\n      var km = document.getElementById('fKm').value.trim();\n      var venditore = document.getElementById('fVenditore').value;\n      var priorita = document.getElementById('fPriorita').value;\n      var causale = document.getElementById('fCausale').value;\n      var posizione = document.getElementById('fPosizione').value;\n      var odlAperto = document.getElementById('fOdl').checked;\n      var hcare = document.getElementById('fHcare').checked;\n      if (!tipo || !targa){\n        showToast('Inserisci almeno tipo veicolo e targa');\n        return;\n      }\n      aggiungiVettura({tipo:tipo, targa:targa, km:km, lavori:tempLavori, priorita:priorita, causale:causale, posizione:posizione, venditore:venditore, odlAperto:odlAperto, hcare:hcare});\n      close();\n    });\n\n    setTimeout(function(){ document.getElementById('fTipo').focus(); }, 50);\n  }\n\n  /* ---------------- PANNELLO DETTAGLIO ---------------- */\n\n  function openPanel(id){\n    openPanelId = id;\n    render();\n  }\n  function closePanel(){\n    openPanelId = null;\n    render();\n    syncNowIfIdle();\n  }\n\n\n  function costiHtml(v){\n    var tar = tariffaOraria(), t = totaliCosti(v);\n    var righe = (v.costi||[]).map(function(c){\n      var det = c.tipo === 'manodopera' ? (' \u00b7 ' + String(c.ore).replace('.',',') + ' h \u00d7 ' + eur(c.tariffa)) : '';\n      return '<div style=\"display:flex;gap:8px;align-items:center;padding:4px 0;border-bottom:1px solid var(--line,#ddd);font-size:13px;\">' +\n        '<span style=\"flex:1\">' + (c.tipo==='manodopera'?'\ud83d\udc77 ':'\ud83d\udd29 ') + escapeHtml(c.desc) + '<span style
