"0 0 24 24\" fill=\"none\" stroke=\"white\" stroke-width=\"2\"><circle cx=\"11\" cy=\"11\" r=\"7\"/><line x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\"/><\/svg>\n      <input id=\"searchInput\" type=\"text\" placeholder=\"Cerca targa, modello...\">\n    <\/div>\n    <select class=\"filter-sel\" id=\"venditoreFilter\"><option value=\"\">Tutti i venditori<\/option><\/select>\n    <span class=\"sync-indicator\" id=\"syncIndicator\">\u25cf Connessione...<\/span>\n    <button class=\"btn btn-ghost btn-sm\" id=\"refreshBtn\" title=\"Aggiorna ora\">\u27f3 Aggiorna<\/button>\n  <\/div>\n<\/header>\n\n<div class=\"tabs\">\n  <button class=\"tab-btn active\" id=\"tabPronte\">Da consegnare <span id=\"countPronte\" class=\"mono\"><\/span><\/button>\n  <button class=\"tab-btn\" id=\"tabConsegnate\">Storico consegne <span id=\"countConsegnate\" class=\"mono\"><\/span><\/button>\n  <button class=\"tab-btn\" id=\"tabHcare\" style=\"border-color:#A855F7; color:#6B21A8;\">\ud83d\udd0b H-Care <span id=\"countHcare\" class=\"mono\"><\/span><\/button>\n<\/div>\n<div class=\"content-wrap\">\n  <div class=\"panelbox\">\n    <div id=\"hcareAlertContainer\"><\/div>\n    <div class=\"grid\" id=\"board\"><\/div>\n  <\/div>\n<\/div>\n\n<footer class=\"hint\">Collegato alla stessa bacheca dell'officina: quando il capo officina sposta una vettura su \"Pronta\" compare qui in automatico (aggiornamento ogni ~7 secondi, o premi \"Aggiorna\"). Nessun account necessario.<\/footer>\n\n<div id=\"modalRoot\"><\/div>\n<div class=\"toast\" id=\"toast\"><\/div>\n\n<script>\n(function(){\n  \"use strict\";\n\n  var RUOLO = window.RUOLO || 'admin';\n  function puo(a){ return RUOLO==='admin' || RUOLO==='vendite'; }\n  document.body.classList.add('ruolo-'+RUOLO);\n  var FIREBASE_URL = 'https://officina-chiappetta-default-rtdb.europe-west1.firebasedatabase.app';\n  var FIREBASE_PATH = '/officina.json';\n\n  var LISTE_DEFAULT = {\n    venditori: ['MILIZIA','FASUOLO','SALTELLINI','GRECO','ESPOSITO','CHIMENTI','GENCARELLI','SICILIANO','OSSEQUIO'],\n    causali: [{id:'ripristino', label:'Ripristino pre-vendita'}, {id:'venduta', label:'Venduta (assistenza cliente)'}],\n    posizioni: [{id:'stock', label:'Stock'}, {id:'carrozzeria', label:'Carrozzeria'}],\n    aggiornato: 0\n  };\n  function cloneListeDefault(){ return JSON.parse(JSON.stringify(LISTE_DEFAULT)); }\n\n  // Le liste (venditori, tipi intervento, posizioni) vivono su Firebase insieme alle vetture.\n  // Firebase cancella gli array vuoti: se le liste sono state personalizzate (aggiornato > 0)\n  // un array mancante significa \"svuotato a mano\", non \"torna ai valori predefiniti\".\n  function normalizeListe(l){\n    var base = cloneListeDefault();\n    if (!l) return base;\n    var personalizzate = !!l.aggiornato;\n    ['venditori','causali','posizioni'].forEach(function(k){\n      if (Array.isArray(l[k])) base[k] = l[k].filter(Boolean);\n      else if (personalizzate) base[k] = [];\n    });\n    base.aggiornato = l.aggiornato || 0;\n    return base;\n  }\n  function getListe(){\n    if (!state.liste) state.liste = cloneListeDefault();\n    return state.liste;\n  }\n  function getVenditori(){ return getListe().venditori; }\n  function labelDa(lista, id){\n    for (var i=0;i<lista.length;i++){ if (lista[i].id === id) return lista[i].label; }\n    return id || '\u2014';\n  }\n  function labelCausale(id){ return labelDa(getListe().causali, id); }\n  function labelPosizione(id){ return labelDa(getListe().posizioni, id); }\n  function iconaCausale(id){ return id === 'venduta' ? '\ud83e\udd1d ' : (id === 'ripristino' ? '\ud83d\udd27 ' : '\ud83c\udff7 '); }\n  function iconaPosizione(id){ return id === 'carrozzeria' ? '\ud83c\udfa8 ' : (id === 'stock' ? '\ud83d\udce6 ' : '\ud83d\udccd '); }\n  function venditoriOpts(){ return getVenditori().map(function(n){ return {value:n, label:n}; }); }\n  function causaliOpts(){ return getListe().causali.map(function(c){ return {value:c.id, label:c.label}; }); }\n  function posizioniOpts(){ return getListe().posizioni.map(function(c){ return {value:c.id, label:c.label}; }); }\n  // Costruisce le <option>; se la vettura ha un valore non pi\u00f9 in elenco lo mantiene comunque selezionabile.\n  function optionsHtml(values, current, noneLabel){\n    var html = noneLabel ? '<option value=\"\">' + escapeHtml(noneLabel) + '<\/option>' : '';\n    var trovato = !current;\n    values.forEach(function(o){\n      if (o.value === current) trovato = true;\n      html += '<option value=\"' + escapeHtml(o.value) + '\"' + (o.value === current ? ' selected' : '') + '>' + escapeHtml(o.label) + '<\/option>';\n    });\n    if (!trovato) html += '<option value=\"' + escapeHtml(current) + '\" selected>' + escapeHtml(current) + '<\/option>';\n    return html;\n  }\n\n  var CAUSALE_LABEL = {ripristino:'Ripristino pre-vendita', venduta:'Venduta'};\n  var HCARE_SNOOZE_KEY = 'hcare_snooze_v1';\n  var HCARE_SNOOZE_DAYS = 2; // riappare dopo 2 giorni\n\n  function getSnooze(){\n    try{ return JSON.parse(localStorage.getItem(HCARE_SNOOZE_KEY)||'{}'); }catch(e){ return {}; }\n  }\n  function setSnooze(map){ localStorage.setItem(HCARE_SNOOZE_KEY, JSON.stringify(map)); }\n  function snoozeHcare(vId){\n    var map = getSnooze();\n    map[vId] = Date.now();\n    setSnooze(map);\n    renderHcareAlert();\n  }\n  function isHcareSnoozed(vId){\n    var map = getSnooze();\n    var ts = map[vId] || 0;\n    return (Date.now() - ts) < HCARE_SNOOZE_DAYS * 24 * 3600 * 1000;\n  }\n\n  function renderHcareAlert(){\n    var container = document.getElementById('hcareAlertContainer');\n    if (!container) return;\n    var daFare = state.vetture.filter(function(v){\n      return v.hcare && !v.hcareFatto && !v.cancellata && !isHcareSnoozed(v.id);\n    });\n    if (!daFare.length || activeTab === 'hcare'){\n      container.innerHTML = '';\n      return;\n    }\n    var items = daFare.map(function(v){\n      return '<div class=\"hcare-alert-item\">' +\n        '<div class=\"info\">\ud83d\udd0b <strong>' + escapeHtml(v.targa) + '<\/strong> \u2014 ' + escapeHtml(v.tipo) +\n          (v.venditore ? ' \u00b7 ' + escapeHtml(v.venditore) : '') + '<br><span style=\"font-size:11.5px;color:#7C3AED;\">Batteria sostituita \u2014 cliente da richiamare per ritorno a 500km<\/span><\/div>' +\n        '<button class=\"snooze\" data-vid=\"' + v.id + '\">Fatto \u00b7 snooze ' + HCARE_SNOOZE_DAYS + 'gg<\/button>' +\n      '<\/div>';\n    }).join('');\n    container.innerHTML =\n      '<div class=\"hcare-alert-bar\">' +\n        '<div class=\"icon\">\ud83d\udd0b<\/div>' +\n        '<div class=\"body\">' +\n          '<h4>H-Care da gestire \u2014 contatta i clienti<\/h4>' +\n          items +\n        '<\/div>' +\n      '<\/div>';\n    container.querySelectorAll('.snooze[data-vid]').forEach(function(btn){\n      btn.addEventListener('click', function(){ snoozeHcare(btn.dataset.vid); });\n    });\n  }\n\n  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }\n  function nowTs(){ return Date.now(); }\n\n  var state = { vetture: [], eventi: [], liste: cloneListeDefault() };\n  var pendingWrites = 0;\n  var searchTerm = '';\n  var venditoreFilterVal = '';\n  var activeTab = 'pronte';\n  var noteModalVehicleId = null;\n\n  function normalizeVettura(v){\n    if (!v.tempi) v.tempi = {};\n    if (typeof v.tempi.inizio === 'undefined') v.tempi.inizio = null;\n    if (typeof v.tempi.fine === 'undefined') v.tempi.fine = null;\n    if (!v.note) v.note = [];\n    if (!v.lavori) v.lavori = [];\n    if (typeof v.ricambiMancanti === 'undefined') v.ricambiMancanti = '';\n    if (typeof v.odlAperto === 'undefined') v.odlAperto = false;\n    if (typeof v.hcare === 'undefined') v.hcare = false;\n    if (typeof v.hcareFatto === 'undefined') v.hcareFatto = false;\n    if (typeof v.consegnata === 'undefined') v.consegnata = false;\n    if (typeof v.dataConsegna === 'undefined') v.dataConsegna = null;\n    return v;\n  }\n\n  function findVettura(id){\n    for (var i=0;i<state.vetture.length;i++){ if (state.vetture[i].id === id) return state.vetture[i]; }\n    return null;\n  }\n\n  function escapeHtml(s){\n    if (s === undefined || s === null) return '';\n    return String(s).replace(/&/g,'&amp;').replace(/<\/g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;');\n  }\n\n  function formatKm(km){\n    if (km === undefined || km === null || km === '') return '\u2014';\n    var n = parseInt(km,10);\n    if (isNaN(n)) return escapeHtml(km);\n    return n.toLocaleString('it-IT') + ' km';\n  }\n\n  function formatDateTime(ts){\n    if (!ts) return '\u2014';\n    var d = new Date(ts);\n    return d.toLocaleDateString('it-IT') + ' ' + d.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});\n  }\n\n  function giorniPronta(v){\n    var fine = v.tempi && v.tempi.fine ? v.tempi.fine : (v.aggiornato || v.creato || nowTs());\n    return Math.floor((nowTs() - fine) / (24*3600*1000));\n  }\n\n  function urgencyColor(giorni){\n    if (giorni >= 3) return '#D9622B';\n    if (giorni >= 1) return '#D9A226';\n    return '#3E8E5B';\n  }\n  function urgencyLabel(giorni){\n    if (giorni <= 0) return 'Pronta oggi';\n    if (giorni === 1) return 'Pronta da 1 giorno';\n    return 'Pronta da ' + giorni + ' giorni';\n  }\n\n  function showToast(msg){\n    var t = document.getElementById('toast');\n    t.textContent = msg;\n    t.classList.add('show');\n    setTimeout(function(){ t.classList.remove('show'); }, 1800);\n  }\n\n  function updateSyncIndicator(status, when){\n    var el = document.getElementById('syncIndicator');\n    if (!el) return;\n    el.classList.remove('ok','err');\n    if (status === 'ok'){\n      el.classList.add('ok');\n      var t = when ? new Date(when).toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit',second:'2-digit'}) : '';\n      el.textContent = '\u25cf Sincronizzato ' + t;\n    } else if (status === 'err'){\n      el.classList.add('err');\n      el.textContent = '\u25cf Errore di sincronizzazione';\n    } else {\n      el.textContent = '\u25cf Connessione...';\n    }\n  }\n\n  async function fetchCloudState(){\n    var res = await fetch(FIREBASE_URL + FIREBASE_PATH, {cache:'no-store'});\n    if (!res.ok) throw new Error('HTTP ' + res.status);\n    var data = await res.json();\n    if (data){\n      data.vetture = (data.vetture || []).map(normalizeVettura);\n      if (!data.eventi) data.eventi = [];\n      data.liste = normalizeListe(data.liste);\n      return data;\n    }\n    return { vetture: [], eventi: [], liste: cloneListeDefault() };\n  }\n\n  function mergeState(local, remote){\n    var map = {};\n    (local.vetture||[]).forEach(function(v){ map[v.id] = v; });\n    (remote.vetture||[]).forEach(function(rv){\n      var lv = map[rv.id];\n      var rvTime = rv.aggiornato || rv.creato || 0;\n      var lvTime = lv ? (lv.aggiornato || lv.creato || 0) : -1;\n      if (!lv || rvTime > lvTime){ map[rv.id] = rv; }\n    });\n    var ids = Object.keys(map);\n    ids.sort(function(a,b){ return (map[a].creato||0) - (map[b].creato||0); });\n\n    var eMap = {};\n    (local.eventi||[]).forEach(function(ev){ eMap[ev.id] = ev; });\n    (remote.eventi||[]).forEach(function(ev){ eMap[ev.id] = ev; });\n    var eIds = Object.keys(eMap);\n    eIds.sort(function(a,b){ return (eMap[b].data||0) - (eMap[a].data||0); });\n    if (eIds.length > 200) eIds = eIds.slice(0, 200);\n\n    var lL = normalizeListe(local.liste), rL = normalizeListe(remote.liste);\n    var liste = (rL.aggiornato > lL.aggiornato) ? rL : lL;\n\n    return { vetture: ids.map(function(id){ return map[id]; }), eventi: eIds.map(function(id){ return eMap[id]; }), liste: liste };\n  }\n\n  async function pushCloudState(){\n    pendingWrites++;\n    try{\n      var res = await fetch(FIREBASE_URL + FIREBASE_PATH, {\n        method: 'PUT', headers: {'Content-Type':'application/json'}, body: JSON.stringify(state)\n      });\n      if (!res.ok) throw new Error('HTTP ' + res.status);\n      updateSyncIndicator('ok', nowTs());\n    }catch(e){\n      console.error('Errore di sincronizzazione', e);\n      updateSyncIndicator('err');\n      showToast('Errore di sincronizzazione: la modifica resta solo su questo schermo, riprova.');\n    }finally{\n      pendingWrites--;\n    }\n  }\n\n  async function writeChange(mutateFn){\n    // Rilegge lo stato fresco, applica la modifica e la fonde per non perdere le scritture dell'officina.\n    try{\n      var fresh = await fetchCloudState();\n      state = mergeState(state, fresh);\n    }catch(e){ /* usa lo stato locale se la lettura fallisce */ }\n    mutateFn();\n    await pushCloudState();\n    render();\n  }\n\n  function creaEvento(vId, tipo, testo){\n    var v = findVettura(vId);\n    if (!state.eventi) state.eventi = [];\n    state.eventi.unshift({\n      id: uid(), vehicleId: vId, vehicleTarga: v ? v.targa : '', vehicleTipo: v ? v.tipo : '',\n      tipo: tipo, testo: testo, data: nowTs()\n    });\n    if (state.eventi.length > 200) state.eventi = state.eventi.slice(0, 200);\n  }\n\n  function segnaConsegnata(id){ if(!puo('vendite')) return;\n    var v = findVettura(id);\n    if (!v) return;\n    if (!confirm('Segnare la vettura ' + v.targa + ' come consegnata al cliente?')) return;\n    writeChange(function(){\n      var vv = findVettura(id);\n      if (!vv) return;\n      vv.consegnata = true;\n      vv.dataConsegna = nowTs();\n      vv.aggiornato = nowTs();\n      creaEvento(id, 'stato', 'Consegnata al cliente da vendite');\n    }).then(function(){ showToast('Vettura segnata come consegnata'); });\n  }\n\n  function riportaInConsegna(id){ if(!puo('vendite')) return;\n    writeChange(function(){\n      var vv = findVettura(id);\n      if (!vv) return;\n      vv.consegnata = false;\n      vv.dataConsegna = null;\n      vv.aggiornato = nowTs();\n      creaEvento(id, 'stato', 'Riportata tra le vetture da consegnare');\n    }).then(function(){ showToast('Vettura riportata tra quelle da consegnare'); });\n  }\n\n  function impostaVenditore(id, val){ if(!puo('vendite')) return;\n    writeChange(function(){\n      var vv = findVettura(id);\n      if (!vv) return;\n      vv.venditore = val;\n      vv.aggiornato = nowTs();\n    }).then(function(){ showToast('Venditore assegnato'); });\n  }\n\n  function apriModaleNota(id){ if(!puo('vendite')) return;\n    noteModalVehicleId = id;\n    var v = findVettura(id);\n    var root = document.getElementById('modalRoot');\n    root.innerHTML =\n      '<div class=\"overlay\" id=\"notaOverlay\">' +\n        '<div class=\"modal\">' +\n          '<div class=\"modal-head\"><h2>Nota per l\\'officina \u2014 ' + escapeHtml(v.targa) + '<\/h2><button class=\"modal-close\" id=\"closeNota\">&times;<\/button><\/div>' +\n          '<div class=\"modal-body\">' +\n            '<div class=\"field\"><label>Messaggio<\/label><textarea id=\"notaTesto\" placeholder=\"es. Cliente confermato per ritiro venerd\u00ec...\"><\/textarea><\/div>' +\n          '<\/div>' +\n          '<div class=\"modal-foot\">' +\n            '<button class=\"btn btn-outline\" id=\"cancelNota\">Annulla<\/button>' +\n            '<button class=\"btn btn-primary\" id=\"confirmNota\">Invia<\/button>' +\n          '<\/div>' +\n        '<\/div>' +\n      '<\/div>';\n    function close(){ root.innerHTML = ''; noteModalVehicleId = null; }\n    document.getElementById('closeNota').addEventListener('click', close);\n    document.getElementById('cancelNota').addEventListener('click', close);\n    document.getElementById('notaOverlay').addEventListener('click', function(e){ if (e.target.id === 'notaOverlay') close(); });\n    document.getElementById('confirmNota').addEventListener('click', function(){\n      var testo = document.getElementById('notaTesto').value.trim();\n      if (!testo) { close(); return; }\n      writeChange(function(){\n        var vv = findVettura(id);\n        if (!vv) return;\n        vv.note.push({testo:testo, data:nowTs()});\n        vv.aggiornato = nowTs();\n        creaEvento(id, 'nota', testo);\n      }).then(function(){ showToast('Nota inviata all\\'officina'); });\n      close();\n    });\n    setTimeout(function(){ document.getElementById('notaTesto').focus(); }, 50);\n  }\n\n  function matchesSearch(v){\n    if (!searchTerm) return true;\n    var t = searchTerm.toLowerCase();\n    return (v.targa||'').toLowerCase().indexOf(t) !== -1 ||\n           (v.tipo||'').toLowerCase().indexOf(t) !== -1 ||\n           (v.venditore||'').toLowerCase().indexOf(t) !== -1;\n  }\n  function matchesVenditoreFilter(v){\n    if (!venditoreFilterVal) return true;\n    return (v.venditore||'') === venditoreFilterVal;\n  }\n\n  var filtroVenditoriFirma = null;\n  function updateVenditoreFilterOptions(){\n    var sel = document.getElementById('venditoreFilter');\n    var nomi = getVenditori().slice();\n    // se \u00e8 attivo un filtro su un venditore non pi\u00f9 in elenco, lo teniamo comunque selezionabile\n    if (venditoreFilterVal && nomi.indexOf(venditoreFilterVal) === -1) nomi.push(venditoreFilterVal);\n    var firma = nomi.join('|');\n    if (firma === filtroVenditoriFirma) return; // elenco invariato: non ricostruire (chiuderebbe la tendina aperta)\n    filtroVenditoriFirma = firma;\n    var current = sel.value || venditoreFilterVal;\n    sel.innerHTML = '<option value=\"\">Tutti i venditori<\/option>' + nomi.map(function(n){\n      return '<option value=\"' + escapeHtml(n) + '\">' + escapeHtml(n) + '<\/option>';\n    }).join('');\n    sel.value = current;\n  }\n\n  function render(){\n    updateVenditoreFilterOptions();\n    var pronteList = state.vetture.filter(function(v){ return v.stato === 'pronta' && !v.cancellata && !v.consegnata; });\n    var consegnateList = state.vetture.filter(function(v){ return v.stato === 'pronta' && !v.cancellata && v.consegnata; });\n    var hcareList = state.vetture.filter(function(v){ return v.hcare && !v.hcareFatto && !v.cancellata; });\n\n    document.getElementById('countPronte').textContent = '(' + pronteList.length + ')';\n    document.getElementById('countConsegnate').textContent = '(' + consegnateList.length + ')';\n    var hcCount = document.getElementById('countHcare');\n    if (hcCount) hcCount.textContent = hcareList.length ? '(' + hcareList.length + ')' : '';\n\n    renderHcareAlert();\n\n    var board = document.getElementById('board');\n    board.innerHTML = '';\n\n    var list;\n    if (activeTab === 'pronte') list = pronteList.filter(matchesSearch).filter(matchesVenditoreFilter);\n    else if (activeTab === 'consegnate') list = consegnateList.filter(matchesSearch).filter(matchesVenditoreFilter);\n    else list = hcareList.filter(matchesSearch).filter(matchesVenditoreFilter); // tab hcare\n\n    if (activeTab === 'pronte') list.sort(function(a,b){ return giorniPronta(b) - giorniPronta(a); });\n    else if (activeTab === 'consegnate') list.sort(function(a,b){ return (b.dataConsegna||0) - (a.dataConsegna||0); });\n    else list.sort(function(a,b){ return (a.hcareRichiestoPer||a.creato||0) - (b.hcareRichiestoPer||b.creato||0); });\n\n    if (list.length === 0){\n      var empty = document.createElement('div');\n      empty.className = 'empty-state';\n      empty.textContent = activeTab === 'pronte' ? 'Nessuna vettura pronta al momento.' :\n                          activeTab === 'consegnate' ? 'Nessuna consegna registrata ancora.' :\n                          '\u2713 Nessun H-Care in sospeso al momento.';\n      board.appendChild(empty);\n      return;\n    }\n\n    list.forEach(function(v){ board.appendChild(renderCard(v)); });\n  }\n\n  function renderCard(v){\n    var card = document.createElement('div');\n    var giorni = giorniPronta(v);\n    var uColor = urgencyColor(giorni);\n    card.className = 'card';\n    card.style.setProperty('--urgency-color', v.consegnata ? '#3E8E5B' : uColor);\n\n    var meta = '<span class=\"pill pill-steel\">' + (v.tempi && v.tempi.fine ? 'pronta il ' + formatDateTime(v.tempi.fine) : 'pronta') + '<\/span>';\n    if (v.lavori && v.lavori.length){\n      var fatti = v.lavori.filter(function(l){return l.fatto;}).length;\n      meta += '<span class=\"pill pill-grey\">' + fatti + '/' + v.lavori.length + ' lavori<\/span>';\n    }\n\n    var notePreview = '';\n    if (v.note && v.note.length){\n      var last = v.note[v.note.length-1];\n      notePreview = '<div class=\"note-preview\">\"' + escapeHtml(last.testo) + '\"<\/div>';\n    }\n\n    var venditoreOptions = optionsHtml(venditoriOpts(), v.venditore || '', '\u2014 Nessuno \u2014');\n\n    card.innerHTML =\n      '<div class=\"card-top\">' +\n        '<div class=\"targa\"><span class=\"strip\">I<\/span><span class=\"code\">' + escapeHtml(v.targa || '\u2014') + '<\/span><\/div>' +\n        '<span class=\"urgency-badge\">' + (v.consegnata ? '\u2713 Consegnata' : urgencyLabel(giorni)) + '<\/span>' +\n      '<\/div>' +\n      '<div class=\"card-tipo\">' + escapeHtml(v.tipo || 'Veicolo') + '<\/div>' +\n      '<div class=\"card-km mono\">' + formatKm(v.km) + '<\/div>' +\n      '<div class=\"tag-row\" style=\"margin-top:7px;\">' +\n        '<span class=\"pill ' + (v.causale === 'venduta' ? 'pill-tag-blue' : 'pill-tag-purple') + '\">' + iconaCausale(v.causale) + escapeHtml(labelCausale(v.causale)) + '<\/span>' +\n        (v.hcare ? '<span class=\"pill ' + (v.hcareFatto ? 'pill-hcare-done' : 'pill-hcare') + '\">' + (v.hcareFatto ? '\ud83d\udd0b H-Care \u2713' : '\ud83d\udd0b H-Care da fare') + '<\/span>' : '') +\n      '<\/div>' +\n      '<div class=\"card-meta\">' + meta + '<\/div>' +\n      '<div class=\"venditore-row\"><label>Venditore<\/label><select class=\"selVend\">' + venditoreOptions + '<\/select><\/div>' +\n      notePreview +\n      (v.consegnata ? '<div class=\"consegnata-info\">Consegnata il ' + formatDateTime(v.dataConsegna) + '<\/div>' : '') +\n      '<div class=\"card-actions\">' +\n        (v.consegnata\n          ? '<button class=\"btn btn-outline btn-sm btnRiporta\">\u21a9 Riporta tra le pronte<\/button>'\n          : '<button class=\"btn btn-outline btn-sm btnNota\">\ud83d\udcac Nota<\/button><button class=\"btn btn-success btn-sm btnConsegna\">\u2713 Consegnata<\/button>'\n        ) +\n      '<\/div>';\n\n    card.querySelector('.selVend').addEventListener('change', function(e){ impostaVenditore(v.id, e.target.value); });\n    var btnConsegna = card.querySelector('.btnConsegna');\n    if (btnConsegna) btnConsegna.addEventListener('click', function(){ segnaConsegnata(v.id); });\n    var btnNota = card.querySelector('.btnNota');\n    if (btnNota) btnNota.addEventListener('click', function(){ apriModaleNota(v.id); });\n    var btnRiporta = card.querySelector('.btnRiporta');\n    if (btnRiporta) btnRiporta.addEventListener('click', function(){ riportaInConsegna(v.id); });\n\n    return card;\n  }\n\n  async function syncNow(){\n    if (pendingWrites > 0) return;\n    try{\n      var fresh = await fetchCloudState();\n      if (pendingWrites > 0) return;\n      state = mergeState(state, fresh);\n      updateSyncIndicator('ok', nowTs());\n      render();\n    }catch(e){\n      updateSyncIndicator('err');\n    }\n  }\n\n  function startPolling(){\n    setInterval(function(){ syncNow(); }, 7000);\n  }\n\n  document.getElementById('searchInput').addEventListener('input', function(e){ searchTerm = e.target.value; render(); });\n  document.getElementById('venditoreFilter').addEventListener('change', function(e){ venditoreFilterVal = e.target.value; render(); });\n  document.getElementById('refreshBtn').addEventListener('click', syncNow);\n  document.getElementById('tabPronte').addEventListener('click', function(){\n    activeTab = 'pronte';\n    document.getElementById('tabPronte').classList.add('active');\n    document.getElementById('tabConsegnate').classList.remove('active');\n    document.getElementById('tabHcare').classList.remove('active');\n    render();\n  });\n  document.getElementById('tabConsegnate').addEventListener('click', function(){\n    activeTab = 'consegnate';\n    document.getElementById('tabConsegnate').classList.add('active');\n    document.getElementById('tabPronte').classList.remove('active');\n    document.getElementById('tabHcare').classList.remove('active');\n    render();\n  });\n  document.getElementById('tabHcare').addEventListener('click', function(){\n    activeTab = 'hcare';\n    document.getElementById('tabHcare').classList.add('active');\n    document.getElementById('tabPronte').classList.remove('active');\n    document.getElementById('tabConsegnate').classList.remove('active');\n    render();\n  });\n\n  setInterval(function(){ render(); }, 60000);\n\n  function avvia(){\n    updateVenditoreFilterOptions();\n    document.getElementById('board').innerHTML = '<div class=\"board-loading\">Caricamento vetture pronte...<\/div>';\n    syncNow().then(startPolling);\n  }\n\n  avvia();\n})();\n<\/script>\n<\/body>\n<\/html>\n"};

 document.querySelectorAll('main > *').forEach(function(e){e.classList.toggle('on',e.dataset.t===t)});
