le>/*MOBILE*/@media (max-width:600px){\nheader.topbar{padding:10px 12px!important;gap:8px!important}\n.brand{gap:8px!important}.brand .badge{display:none!important}.brand h1{font-size:17px!important}.brand p{display:none!important}\n.topbar-actions{width:100%;gap:6px!important}\n.search-box{flex:1 1 100%!important;min-width:0}.search-box input{width:100%!important;min-width:0;font-size:14px!important;padding:8px 10px 8px 34px!important}\n.sync-indicator{font-size:11px!important}\n.btn{padding:7px 9px!important;font-size:12px!important}.topbar-actions{gap:5px!important}\n.board-wrap{padding:10px!important}\n.board{gap:10px!important}\n.column{padding:0!important}\n.column-head{padding:10px 12px!important}.column-head h2{font-size:12.5px!important}\n.card{padding:10px 12px!important}\nfooter.hint{font-size:11px!important;padding:10px 14px 20px!important}\n}<\/style><\/head>\n<body>\n\n<header class=\"topbar\">\n  <div class=\"brand\">\n    <div class=\"badge\">\u2699<\/div>\n    <div>\n      <h1>Officina \u2014 Lavorazioni<\/h1>\n      <p>Chiappetta Auto Srl \u2014 Avanzamento vetture in officina<\/p>\n    <\/div>\n  <\/div>\n  <div class=\"topbar-actions\">\n    <div class=\"search-box\">\n      <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"white\" stroke-width=\"2\"><circle cx=\"11\" cy=\"11\" r=\"7\"/><line x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\"/><\/svg>\n      <input id=\"searchInput\" type=\"text\" placeholder=\"Cerca targa, modello o venditore...\">\n    <\/div>\n    <button class=\"btn btn-ghost btn-sm\" id=\"bellBtn\" title=\"Notifiche\" style=\"position:relative;\">\ud83d\udd14 <span class=\"bell-badge\" id=\"bellBadge\" style=\"display:none;\">0<\/span><\/button>\n    <span class=\"sync-indicator\" id=\"syncIndicator\">\u25cf Connessione...<\/span>\n    <button class=\"btn btn-ghost btn-sm\" id=\"refreshBtn\" title=\"Aggiorna ora\">\u27f3 Aggiorna<\/button>\n    <button class=\"btn btn-ghost btn-sm\" id=\"archiveBtn\" ti var t = e.target; if (!t.closest || !t.closest('.panel') || t.id === 'newNotaInput') return;\n      e.stopPropagation(); if (t.type === 'checkbox') t.checked = !t.checked;\n    }, true);\n  }\n  var FIREBASE_URL = 'https://officina-toyota-hub-default-rtdb.europe-west1.firebasedatabase.app';\n  var FIREBASE_PATH = '/officina.json';\n  var LISTE_DEFAULT = {\n    venditori: ['MILIZIA','FASUOLO','SALTELLINI','GRECO','ESPOSITO','CHIMENTI','GENCARELLI','SICILIANO','OSSEQUIO'],\n    causali: [{id:'ripristino', label:'Ripristino pre-vendita'}, {id:'venduta', label:'Venduta (assistenza cliente)'}],\n    posizioni: [{id:'stock', label:'Stock'}, {id:'carrozzeria', label:'Carrozzeria'}],\n    aggiornato: 0\n  };\n  function cloneListeDefault(){ return JSON.parse(JSON.stringify(LISTE_DEFAULT)); }\n\n  // Le liste (venditori, tipi intervento, posizioni) vivono su Firebase insieme alle vetture.\n  // Firebase cancella gli array vuoti: se le liste sono state personalizzate (aggiornato > 0)\n  // un array mancante significa \"svuotato a mano\", non \"torna ai valori predefiniti\".\n  function normalizeListe(l){\n    var base = cloneListeDefault();\n    if (!l) return base;\n    var personalizzate = !!l.aggiornato;\n    ['venditori','causali','posizioni'].forEach(function(k){\n      if (Array.isArray(l[k])) base[k] = l[k].filter(Boolean);\n      else if (personalizzate) base[k] = [];\n    });\n    base.aggiornato = l.aggiornato || 0;\n    base.tariffaOraria = Number(l.tariffaOraria) || 0;\n    return base;\n  }\n  function getListe(){\n    if (!state.liste) state.liste = cloneListeDefault();\n    return state.liste;\n  }\n  function getVenditori(){ return getListe().venditori; }\n  function labelDa(lista, id){\n    for (var i=0;i<lista.length;i++){ if (lista[i].id === id) return lista[i].label; }\n    return id || '\u2014';\n  }\n  function labelCausale(id){ return labelDa(getListe().causali, id); }\n  function labelPosizione(id){ return labelDa(getListe().posizioni, id); }\n  function iconaCausale(id){ return id === 'venduta' ? '\ud83e\udd1d ' : (id === 'ripristino' ? '\ud83d\udd27 ' : '\ud83c\udff7 '); }\n  function iconaPosizione(id){ return id === 'carrozzeria' ? '\ud83c\udfa8 ' : (id === 'stock' ? '\ud83d\udce6 ' : '\ud83d\udccd '); }\n  function venditoriOpts(){ return getVenditori().map(function(n){ return {value:n, label:n}; }); }\n  function causaliOpts(){ return getListe().causali.map(function(c){ return {value:c.id, label:c.label}; }); }\n  function posizioniOpts(){ return getListe().posizioni.map(function(c){ return {value:c.id, label:c.label}; }); }\n  // Costruisce le <option>; se la vettura ha un valore non pi\u00f9 in elenco lo mantiene comunque selezionabile.\n  function optionsHtml(values, current, noneLabel){\n    var html = noneLabel ? '<option value=\"\">' + escapeHtml(noneLabel) + '<\/option>' : '';\n    var trovato = !current;\n    values.forEach(function(o){\n      if (o.value === current) trovato = true;\n      html += '<option value=\"' + escapeHtml(o.value) + '\"' + (o.value === current ? ' selected' : '') + '>' + escapeHtml(o.label) + '<\/option>';\n    });\n    if (!trovato) html += '<option value=\"' + escapeHtml(current) + '\" selected>' + escapeHtml(current) + '<\/option>';\n    return html;\n  }\n\n  var GIORNI_ARCHIVIO = 7;\n\n  var STATI = [\n    {key:'pianificare', label:'Da pianificare', color:'#6B7280', bg:'#E9EAEC'},\n    {key:'lavorazione', label:'In lavorazione', color:'#D9A226', bg:'#FBF1DC'},\n    {key:'ricambi',     label:'Attesa ricambi', color:'#D9622B', bg:'#FBE6DA'},\n    {key:'pronta',      label:'Pronta',         color:'#3E8E5B', bg:'#E1F1E7'}\n  ];\n\n  var PRIORITA_LABEL = {bassa:'Bassa', media:'Media', alta:'Alta'};\n  var PRIORITA_PESO = {bassa:1, media:2, alta:3};\n  var CAUSALE_LABEL = {ripristino:'Ripristino pre-vendita', venduta:'Venduta'};\n  var POSIZIONE_LABEL = {stock:'Stock', carrozzeria:'Carrozzeria'};\n\n  function statoInfo(key){\n    for (var i=0;i<STATI.length;i++){ if (STATI[i].key===key) return STATI[i]; }\n    return STATI[0];\n  }\n\n  function uid(){\n    return Date.now().toString(36) + Math.random().toString(36).slice(2,8);\n  }\n\n  function nowTs(){ return Date.now(); }\n\n  var modalOpen = false;\n  var lastSyncOk = null;\n  var pendingWrites = 0;\n\n  function isUiBusy(){\n    return !!openPanelId || modalOpen || pendingWrites > 0;\n  }\n\n  function updateSyncIndicator(status, when){\n    var el = document.getElementById('syncIndicator');\n    if (!el) return;\n    el.classList.remove('ok','err');\n    if (status === 'ok'){\n      el.classList.add('ok');\n      var t = when ? new Date(when).toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit',second:'2-digit'}) : '';\n      el.textContent = '\u25cf Sincronizzato ' + t;\n    } else if (status === 'err'){\n      el.classList.add('err');\n      el.textContent = '\u25cf Errore di sincronizzazione';\n    } else {\n      el.textContent = '\u25cf Connessione...';\n    }\n  }\n\n  function normalizeVettura(v){\n    // Firebase elimina i campi vuoti/null quando salva i dati (es. tempi:{inizio:null,fine:null},\n    // note:[] o lavori:[]). Li ripristiniamo qui per evitare errori in lettura.\n    if (!v.tempi) v.tempi = {};\n    if (typeof v.tempi.inizio === 'undefined') v.tempi.inizio = null;\n    if (typeof v.tempi.fine === 'undefined') v.tempi.fine = null;\n    if (!v.note) v.note = [];\n    if (!v.lavori) v.lavori = [];\n    if (typeof v.ricambiMancanti === 'undefined') v.ricambiMancanti = '';\n    if (typeof v.odlAperto === 'undefined') v.odlAperto = false;\n    if (typeof v.hcare === 'undefined') v.hcare = false;\n    if (typeof v.hcareFatto === 'undefined') v.hcareFatto = false;\n    if (!Array.isArray(v.costi)) v.costi = v.costi ? Object.keys(v.costi).map(function(k){return v.costi[k];}) : [];\n    return v;\n  }\n\n  async function fetchCloudState(){\n    try{\n      var res = await fetch(FIREBASE_URL + FIREBASE_PATH, {cache:'no-store'});\n      if (!res.ok) throw new Error('HTTP ' + res.status);\n      var data = await res.json();\n      if (data){\n        data.vetture = (data.vetture || []).map(normalizeVettura);\n        if (!data.eventi) data.eventi = [];\n        data.liste = normalizeListe(data.liste);\n        return data;\n      }\n      return { vetture: [], eventi: [], liste: cloneListeDefault() };\n    }catch(e){\n      throw e;\n    }\n  }\n\n  async function pushCloudState(){\n    pendingWrites++;\n    try{\n      var res = await fetch(FIREBASE_URL + FIREBASE_PATH, {\n        method: 'PUT',\n        headers: {'Content-Type':'application/json'},\n        body: JSON.stringify(state)\n      });\n      if (!res.ok) throw new Error('HTTP ' + res.status);\n      lastSyncOk = nowTs();\n      updateSyncIndicator('ok', lastSyncOk);\n    }catch(e){\n      console.error('Errore di sincronizzazione', e);\n      updateSyncIndicator('err');\n      showToast('Errore di sincronizzazione: la modifica resta solo su questo schermo, riprova.');\n    }finally{\n      pendingWrites--;\n    }\n  }\n\n  // Manteniamo il nome \"saveState\" cos\u00ec tutte le funzioni esistenti continuano a funzionare,\n  // ma adesso scrive sul database Firebase condiviso invece che nel browser locale.\n  function saveState(){\n    pushCloudState();\n  }\n\n  var state = { vetture: [], eventi: [], liste: cloneListeDefault() };\n  var openPanelId = null;\n  var searchTerm = '';\n  var dragVehicleId = null;\n\n  function findVettura(id){\n    for (var i=0;i<state.vetture.length;i++){\n      if (state.vetture[i].id === id) return state.vetture[i];\n    }\n    return null;\n  }\n\n  function showToast(msg){\n    var t = document.getElementById('toast');\n    t.textContent = msg;\n    t.classList.add('show');\n    setTimeout(function(){ t.classList.remove('show'); }, 1800);\n  }\n\n  function escapeHtml(s){\n    if (s === undefined || s === null) return '';\n    return String(s)\n      .replace(/&/g,'&amp;').replace(/<\/g,'&lt;').replace(/>/g,'&gt;')\n      .replace(/\"/g,'&quot;');\n  }\n\n  function formatKm(km){\n    if (km === undefined || km === null || km === '') return '\u2014';\n    var n = parseInt(km,10);\n    if (isNaN(n)) return escapeHtml(km);\n    return n.toLocaleString('it-IT') + ' km';\n  }\n\n  function formatDateTime(ts){\n    if (!ts) return '\u2014';\n    var d = new Date(ts);\n    return d.toLocaleDateString('it-IT') + ' ' + d.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});\n  }\n\n  function formatDuration(ms){\n    if (ms < 0) ms = 0;\n    var mins = Math.floor(ms / 60000);\n    var giorni = Math.floor(mins / (60*24));\n    var ore = Math.floor((mins % (60*24)) / 60);\n    var minuti = mins % 60;\n    var parts = [];\n    if (giorni > 0) parts.push(giorni + 'g');\n    if (ore > 0 || giorni > 0) parts.push(ore + 'h');\n    parts.push(minuti + 'm');\n    return parts.join(' ');\n  }\n\n  function formatGiacenza(ms){\n    if (ms < 0) ms = 0;\n    var hoursTotal = Math.floor(ms / 3600000);\n    var giorni = Math.floor(hoursTotal / 24);\n    var ore = hoursTotal % 24;\n    if (giorni > 0) return giorni + 'g ' + ore + 'h';\n    return ore + 'h';\n  }\n\n  function calcGiacenza(v){\n    var fine = (v.stato === 'pronta' && v.tempi.fine) ? v.tempi.fine : nowTs();\n    return fine - v.creato;\n  }\n\n  function isArchiviata(v){\n    if (v.stato !== 'pronta') return false;\n    if (v.archiviataManuale === true) return true;   // archiviata a mano, anche prima dei 7 giorni\n    if (v.archiviataManuale === false) return false;  // riportata in bacheca a mano, anche dopo i 7 giorni\n    return v.tempi && v.tempi.fine && (nowTs() - v.tempi.fine) > GIORNI_ARCHIVIO * 24 * 3600 * 1000;\n  }\n\n  function impostaArchiviazione(vId, val){ if(!puo('officina')) return;\n    var v = findVettura(vId);\n    if (!v) return;\n    v.archiviataManuale = val;\n    v.aggiornato = nowTs();\n    saveState();\n    render();\n  }\n\n  function lavoriProgress(v){\n    var totale = v.lavori.length;\n    var fatti = v.lavori.filter(function(l){return l.fatto;}).length;\n    return {fatti:fatti, totale:totale};\n  }\n\n  function matchesSearch(v){\n    if (!searchTerm) return true;\n    var t = searchTerm.toLowerCase();\n    return (v.targa||'').toLowerCase().indexOf(t) !== -1 ||\n           (v.tipo||'').toLowerCase().indexOf(t) !== -1 ||\n           (v.venditore||'').toLowerCase().indexOf(t) !== -1;\n  }\n\n  /* ---------------- RENDER BOARD ---------------- */\n\n  function render(){\n    var board = document.getElementById('board');\n    board.innerHTML = '';\n\n    var archiveCountEl = document.getElementById('archiveCount');\n    if (archiveCountEl){\n      var nArchiviate = state.vetture.filter(function(v){ return isArchiviata(v) && !v.cancellata && !nascosta(v); }).length;\n      archiveCountEl.textContent = '(' + nArchiviate + ')';\n    }\n    updateBellBadge();\n\n    STATI.forEach(function(stato){\n      var col = document.createElement('div');\n      col.className = 'column';\n      col.style.setProperty('--col-color', stato.color);\n      col.dataset.stato = stato.key;\n\n      var vetture = state.vetture.filter(function(v){ return v.stato === stato.key && !v.cancellata && !nascosta(v) && !isArchiviata(v) && matchesSearch(v); });\n\n      var head = document.createElement('div');\n      head.className = 'column-head';\n      head.innerHTML =\n        '<div class=\"title\"><span class=\"dot\"><\/span><h2>' + escapeHtml(stato.label) + '<\/h2><\/div>' +\n        '<span class=\"count\">' + vetture.length + '<\/span>';\n      col.appendChild(head);\n\n      var body = document.createElement('div');\n      body.className = 'column-body';\n\n      if (vetture.length === 0){\n        var empty = document.createElement('div');\n        empty.className = 'empty-col';\n        empty.textContent = 'Nessuna vettura';\n        body.appendChild(empty);\n      } else {\n        vetture.sort(function(a,b){\n          var diff = (PRIORITA_PESO[b.priorita]||2) - (PRIORITA_PESO[a.priorita]||2);\n          if (diff !== 0) return diff;\n          return (b.aggiornato||b.creato) - (a.aggiornato||a.creato);\n        });\n        vetture.forEach(function(v){\n          body.appendChild(renderCard(v, stato));\n        });\n      }\n\n      col.appendChild(body);\n\n      col.addEventListener('dragover', function(e){\n        e.preventDefault();\n        col.classList.add('drag-over');\n      });\n      col.addEventListener('dragleave', function(){\n        col.classList.remove('drag-over');\n      });\n      col.addEventListener('drop', function(e){\n        e.preventDefault();\n        col.classList.remove('drag-over');\n        if (dragVehicleId){\n          cambiaStato(dragVehicleId, col.dataset.stato);\n          dragVehicleId = null;\n        }\n      });\n\n      board.appendChild(col);\n    });\n\n    renderPanel();\n  }\n\n  function renderCard(v, stato){\n    var card = document.createElement('div');\n    card.className = 'card';\n    card.style.setProperty('--col-color', stato.color);\n    card.draggable = puo('officina') && !v.bozza;\n    if (v.bozza) card.style.outline = '2px dashed #D9A226';\n\n    var prog = lavoriProgress(v);\n    var meta = (v.bozza ? '<span class=\"pill pill-amber\">\ud83d\udcdd Bozza \u2014 da completare<\/span>' : '') + '<span class=\"pill pill-steel\">\u23f3 ' + formatGiacenza(calcGiacenza(v)) + ' in officina<\/span>';\n\n    if (stato.key === 'lavorazione' && v.tempi.inizio){\n      meta += '<span class=\"pill pill-amber\">\u23f1 ' + formatDuration(nowTs() - v.tempi.inizio) + '<\/span>';\n    }\n    if (stato.key === 'pronta' && v.tempi.inizio && v.tempi.fine){\n      meta += '<span class=\"pill pill-green\">\u2713 ' + formatDuration(v.tempi.fine - v.tempi.inizio) + ' tot.<\/span>';\n    }\n    if (v.ricambiMancanti && v.ricambiMancanti.trim()){\n      meta += '<span class=\"pill pill-rust\">Ricambi mancanti<\/span>';\n    }\n    if (prog.totale > 0){\n      meta += '<span class=\"pill pill-grey\">' + prog.fatti + '/' + prog.totale + ' lavori<\/span>';\n    }\n\n    var notePreview = '';\n    if (v.note && v.note.length){\n      var last = v.note[v.note.length-1];\n      notePreview = '<div class=\"card-note-preview\">\"' + escapeHtml(last.testo) + '\"<\/div>';\n    }\n\n    card.innerHTML =\n      '<button class=\"card-del\" title=\"Elimina vettura\" data-id=\"' + v.id + '\">\u2715<\/button>' +\n      '<div class=\"card-top\">' +\n        '<div class=\"targa\"><span class=\"strip\">I<\/span><span class=\"code\">' + escapeHtml(v.targa || '\u2014') + '<\/span><\/div>' +\n        '<span class=\"priority-badge priority-' + v.priorita + '\">' + PRIORITA_LABEL[v.priorita] + '<\/span>' +\n      '<\/div>' +\n      '<div class=\"card-tipo\">' + escapeHtml(v.tipo || 'Veicolo') + '<\/div>' +\n      '<div class=\"card-km mono\">' + formatKm(v.km) + '<\/div>' +\n      (v.venditore ? '<div class=\"card-km\" style=\"color:var(--steel-dark); font-weight:600; font-family:Inter,sans-serif; font-size:11.5px; margin-top:3px;\">\ud83d\udc64 ' + escapeHtml(v.venditore) + '<\/div>' : '') +\n      '<div class=\"tag-row\">' +\n        '<span class=\"pill ' + (v.causale === 'venduta' ? 'pill-tag-blue' : 'pill-tag-purple') + '\">' + iconaCausale(v.causale) + escapeHtml(labelCausale(v.causale)) + '<\/span>' +\n        '<span class=\"pill ' + (v.posizione === 'carrozzeria' ? 'pill-tag-copper' : 'pill-grey') + '\">' + iconaPosizione(v.posizione) + escapeHtml(labelPosizione(v.posizione)) + '<\/span>' +\n        '<span class=\"pill ' + (v.odlAperto ? 'pill-odl-yes' : 'pill-odl-no') + '\">' + (v.odlAperto ? '\ud83d\udcc4 ODL aperto' : '\u26a0 ODL non aperto') + '<\/span>' +\n        (v.hcare ? '<span class=\"pill ' + (v.hcareFatto ? 'pill-hcare-done' : 'pill-hcare') + '\">' + (v.hcareFatto ? '\ud83d\udd0b H-Care \u2713' : '\ud83d\udd0b H-Care richiesto') + '<\/span>' : '') +\n      '<\/div>' +\n      '<div class=\"card-meta\">' + meta + '<\/div>' +\n      notePreview;\n\n    card.addEventListener('click', function(e){\n      if (e.target.closest('.card-del')) return;\n      openPanel(v.id);\n    });\n\n    card.querySelector('.card-del').addEventListener('click', function(e){\n      e.stopPropagation();\n      eliminaVettura(v.id);\n    });\n\n    card.addEventListener('dragstart', function(){\n      dragVehicleId = v.id;\n      card.classList.add('dragging');\n    });\n    card.addEventListener('dragend', function(){\n      card.classList.remove('dragging');\n    });\n\n    return card;\n  }\n\n  /* ---------------- AZIONI SUI DATI ---------------- */\n\n  function nascosta(v){\n    if (v.bozza && RUOLO !== 'admin') return true;\n    if (RUOLO === 'vendite') { var n = ''; try { n = String(window.parent.VEND_NOME || ''); } catch(e) {} return !n || String(v.venditore || '').trim().toUpperCase() !== n.trim().toUpperCase(); }\n    return false;\n  }\n\n  function creaEvento(vId, tipo, testo){\n    var v = findVettura(vId);\n    if (!state.eventi) state.eventi = [];\n    state.eventi.unshift({\n      id: uid(),\n      vehicleId: vId,\n      vehicleTarga: v ? v.targa : '',\n      vehicleTipo: v ? v.tipo : '',\n      tipo: tipo, // 'stato' | 'nota'\n      testo: testo,\n      data: nowTs()\n    });\n    if (state.eventi.length > 200) state.eventi = state.eventi.slice(0, 200);\n  }\n\n  function cambiaStato(id, nuovoStato){ if(!puo('officina')) return;\n    var v = findVettura(id);\n    if (!v || v.stato === nuovoStato) return;\n    var statoVecchio = statoInfo(v.stato).label;\n    v.stato = nuovoStato;\n    v.aggiornato = nowTs();\n    v.archiviataManuale = null; // si ricalcola da capo ad ogni cambio di stato\n    if (nuovoStato === 'lavorazione' && !v.tempi.inizio){\n      v.tempi.inizio = nowTs();\n    }\n    if (nuovoStato === 'pronta' && v.tempi.inizio && !v.tempi.fine){\n      v.tempi.fine = nowTs();\n    }\n    if (nuovoStato !== 'pronta'){\n      v.tempi.fine = null;\n    }\n    creaEvento(id, 'stato', statoVecchio + ' \u2192 ' + statoInfo(nuovoStato).label);\n    saveState();\n    render();\n  }\n\n  function eliminaVettura(id){ if(!puo('admin')) return;\n    var v = findVettura(id);\n    if (!v) return;\n    if (!confirm('Eliminare la vettura ' + (v.targa || '') + ' (' + (v.tipo || '') + ')? Operazione non reversibile.')) return;\n    v.cancellata = true;\n    v.aggiornato = nowTs();\n    saveState();\n    if (openPanelId === id) closePanel();\n    render();\n    showToast('Vettura eliminata');\n  }\n\n  function aggiungiVettura(data){ if(!puo('crea')) return;\n    var v = {\n      id: uid(),\n      tipo: data.tipo,\n      targa: data.targa.toUpperCase(),\n      km: data.km,\n      stato: 'pianificare',\n      priorita: data.priorita || 'media',\n      causale: data.causale || 'ripristino',\n      posizione: data.posizione || 'stock',\n      venditore: data.venditore || '',\n      odlAperto: !!data.odlAperto,\n      hcare: !!data.hcare,\n      hcareFatto: false,\n      lavori: data.lavori.map(function(testo){ return {id: uid(), testo: testo, fatto:false}; }),\n      ricambiMancanti: '',\n      note: [],\n      tempi: {inizio:null, fine:null},\n      creato: nowTs(),\n      aggiornato: nowTs()\n    };\n    state.vetture.push(v);\n    saveState();\n    render();\n    showToast('Vettura aggiunta alla bacheca');\n  }\n\n  function rilasciaBozza(vId, km, tipo){ if(!puo('admin')) return;\n    var v = findVettura(vId); if (!v) return;\n    if (tipo) v.tipo = tipo;\n    if (km !== '' && km !== null && !isNaN(parseInt(km,10))) v.km = parseInt(km,10);\n    v.bozza = false;\n    v.creato = nowTs();\n    v.aggiornato = nowTs();\n    creaEvento(v.id, 'stato', 'Nuova vettura in officina' + (v.venditore ? ' \u00b7 ' + v.venditore : ''));\n    saveState(); render();\n    showToast('Vettura inviata all\\'officina');\n  }\n  function scartaBozza(vId){ if(!puo('admin')) return;\n    var v = findVettura(vId); if (!v) return;\n    v.cancellata = true; v.aggiornato = nowTs();\n    saveState(); render();\n    showToast('Bozza eliminata');\n  }\n\n  function toggleLavoro(vId, lavoroId){ if(!puo('officina')) return;\n    var v = findVettura(vId);\n    if (!v) return;\n    var l = v.lavori.find(function(x){ return x.id === lavoroId; });\n    if (!l) return;\n    l.fatto = !l.fatto;\n    v.aggiornato = nowTs();\n    saveState();\n    render();\n  }\n\n  function rimuoviLavoro(vId, lavoroId){ if(!puo('officina')) return;\n    var v = findVettura(vId);\n    if (!v) return;\n    v.lavori = v.lavori.filter(function(x){ return x.id !== lavoroId; });\n    v.aggiornato = nowTs();\n    saveState();\n    render();\n  }\n\n  function aggiungiLavoro(vId, testo){ if(!puo('officina')) return;\n    testo = (testo||'').trim();\n    if (!testo) return;\n    var v = findVettura(vId);\n    if (!v) return;\n    v.lavori.push({id:uid(), testo:testo, fatto:false});\n    v.aggiornato = nowTs();\n    saveState();\n    render();\n  }\n\n\n  // ===== COSTI RIPRISTINO (preventivi, ricambi, manodopera) =====\n  function tariffaOraria(){ return Number(getListe().tariffaOraria) || 0; }\n  function eur(n){ return (Number(n)||0).toLocaleString('it-IT',{minimumFractionDigits:2,maximumFractionDigits:2}) + ' \u20ac'; }\n  function totaliCosti(v){\n    var t = {ricambi:0, carrozzeria:0, manodopera:0, totale:0};\n    (v.costi||[]).forEach(function(c){\n      var i = Number(c.importo)||0;\n      if (c.tipo === 'manodopera') t.manodopera += i; else if (c.tipo === 'carrozzeria') t.carrozzeria += i; else t.ricambi += i;\n      t.totale += i;\n    });\n    return t;\n  }\n  function aggiungiCosto(vId, voce){ if(!puo('costi')) return;\n    var v = findVettura(vId); if (!v) return;\n    if (!v.costi) v.costi = [];\n    voce.id = uid();\n    v.costi.push(voce);\n    v.aggiornato = nowTs();\n    saveState(); render();\n  }\n  function rimuoviCosto(vId, cId){ if(!puo('costi')) return;\n    var v = findVettura(vId); if (!v) return;\n    if (!v.costi) v.costi = [];\n    v.costi = v.costi.filter(function(c){ return c.id !== cId; });\n    v.aggiornato = nowTs();\n    saveState(); render();\n  }\n  // usato dall'hub admin: aggiunge un costo (fattura carrozzeria esterna) alla vettura con quella targa\n  window.__addCostoTarga = function(targa, voce){\n    if (RUOLO !== 'admin') return 'no';\n    if (!lastSyncOk) return 'wait';\n    var n = String(targa||'').replace(/[^A-Za-z0-9]/g,'').toUpperCase(), v = null;\n    state.vetture.forEach(function(x){ if (!x.cancellata && String(x.targa||'').replace(/[^A-Za-z0-9]/g,'').toUpperCase() === n) v = x; });\n    if (!v) return 'nessuna';\n    if (!v.costi) v.costi = [];\n    if (v.costi.some(function(c){ return c.id === voce.id; })) return 'ok';\n    v.costi.push(voce); v.aggiornato = nowTs(); saveState(); render(); return 'ok';\n  };\n  function parseImporto(t){\n    t = String(t||'').replace(/[\u20ac\\s]/g,'');\n    if (!t) return NaN;\n    if (/,/.test(t)) t = t.replace(/\\./g,'').replace(',','.');\n    return parseFloat(t);\n  }\n  function caricaPdfJs(){\n    if (window.pdfjsLib) return Promise.resolve(window.pdfjsLib);\n    return new Promise(function(res, rej){\n      var sc = document.createElement('script');\n      sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';\n      sc.onload = function(){\n        window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';\n        res(window.pdfjsLib);\n      };\n      sc.onerror = function(){ rej(new Error('pdf.js non raggiungibile')); };\n      document.head.appendChild(sc);\n    });\n  }\n  async function righeDaPdf(file){\n    var lib = await caricaPdfJs();\n    var buf = await file.arrayBuffer();\n    var pdf = await lib.getDocument({data:buf}).promise;\n    var righe = [];\n    for (var p = 1; p <= pdf.numPages; p++){\n      var page = await pdf.getPage(p);\n      var tc = await page.getTextContent();\n      var linee = {};\n      tc.items.forEach(function(it){\n        var y = Math.round(it.transform[5] / 3);\n        (linee[y] = linee[y] || []).push({x: it.transform[4], t: it.str});\n      });\n      Object.keys(linee).map(Number).sort(function(a,b){return b-a;}).forEach(function(y){\n        var testo = linee[y].sort(function(a,b){return a.x-b.x;}).map(function(i){return i.t;}).join(' ').replace(/\\s+/g,' ').trim();\n        if (testo) righe.push(testo);\n      });\n    }\n    var out = [];\n    righe.forEach(function(r){\n      var m = r.match(/(\\d{1,3}(?:\\.\\d{3})*,\\d{2})(?!.*\\d{1,3}(?:\\.\\d{3})*,\\d{2})/);\n      if (!m) return;\n      var imp = parseImporto(m[1]);\n      if (!(imp > 0)) return;\n      var desc = r.replace(/(\\d{1,3}(?:\\.\\d{3})*,\\d{2}\\s*\u20ac?\\s*)+/g,' ').replace(/\\s+/g,' ').trim();\n      if (!desc) desc = 'Voce da PDF';\n      var tot = /totale|imponibile|iva|netto|da pagare|acconto|sconto/i.test(r);\n      out.push({desc: desc.slice(0,90), importo: imp, totale: tot});\n    });\n    return out;\n  }\n  function apriPdfCosti(vId, file){\n    var root = document.getElementById('modalRoot');\n    modalOpen = true;\n    root.innerHTML = '<div class=\"overlay\"><div class=\"modal\" style=\"max-width:640px;\"><div class=\"modal-head\"><h2>Lettura PDF\u2026<\/h2><\/div><div class=\"modal-body\">Sto leggendo \u00ab' + escapeHtml(file.name) + '\u00bb\u2026<\/div><\/div><\/div>';\n    function chiudi(){ root.innerHTML=''; modalOpen=false; render(); }\n    righeDaPdf(file).then(function(righe){\n      if (!righe.length){\n        root.innerHTML = '<div class=\"overlay\"><div class=\"modal\" style=\"max-width:520px;\"><div class=\"modal-head\"><h2>Nessuna voce trovata<\/h2><button class=\"modal-close\" id=\"pdfX\">&times;<\/button><\/div><div class=\"modal-body\">Non sono riuscito a leggere importi in questo PDF (potrebbe essere una scansione/immagine). Inserisci le voci a mano.<\/div><div class=\"modal-foot\"><button class=\"btn btn-primary\" id=\"pdfOk\">Ok<\/button><\/div><\/div><\/div>';\n        document.getElementById('pdfX').onclick = chiudi; document.getElementById('pdfOk').on cb.dataset.i+'\"]').value);\n          if (v > 0) t += v;\n        });\n        document.getElementById('pdfTot').textContent = eur(t);\n      }\n      root.addEventListener('input', calc); root.addEventListener('change', calc); calc();\n      document.getElementById('pdfX').onclick = chiudi; document.getElementById('pdfAnnulla').onclick = chiudi;\n      document.getElementById('pdfConf').onclick = function(){\n        var v = findVettura(vId); if (!v){ chiudi(); return; }\n        var n = 0;\n        root.querySelectorAll('input[type=checkbox]').forEach(function(cb){\n          if (!cb.checked) return;\n          var i = cb.dataset.i;\n          var imp = parseImporto(root.querySelector('.pdfImp[data-i=\"'+i+'\"]').value);\n          var d = root.querySelector('.pdfDesc[data-i=\"'+i+'\"]').value.trim() || 'Voce da PDF';\n          if (!(imp > 0)) return;\n          v.costi.push({id: uid(), tipo: (document.getElementById('pdfTipo')||{}).value==='carrozzeria'?'carrozzeria':'ricambi', desc: d, importo: imp, fonte:'pdf'}); n++;\n        });\n        if (n){ v.aggiornato = nowTs(); saveState(); }\n        showToast(n + (n===1?' voce aggiunta':' voci aggiunte'));\n        chiudi();\n      };\n    }).catch(function(err){\n      root.innerHTML = '<div class=\"overlay\"><div class=\"modal\" style=\"max-width:520px;\"><div class=\"modal-head\"><h2>PDF non letto<\/h2><button class=\"modal-close\" id=\"pdfX\">&times;<\/button><\/div><div class=\"modal-body\">'+escapeHtml(err.message||'Errore')+'. Controlla la connessione oppure inserisci le voci a mano.<\/div><div class=\"modal-foot\"><button class=\"btn btn-primary\" id=\"pdfOk\">Ok<\/button><\/div><\/div><\/div>';\n      document.getElementById('pdfX').onclick = chiudi; document.getElementById('pdfOk').onclick = chiudi;\n    });\n  }\n\n  function impostaPriorita(vId, val){ if(!puo('admin')) return;\n    var v = findVettura(vId);\n    if (!v) return;\n    v.priorita = val;\n    v.aggiornato = nowTs();\n    saveState();\n    render();\n  }\n\n  function impostaCausale(vId, val){ if(!puo('admin')) return;\n    var v = findVettura(vId);\n    if (!v) return;\n    v.causale = val;\n    v.aggiornato = nowTs();\n    saveState();\n    render();\n  }\n\n  function impostaPosizione(vId, val){ if(!puo('admin')) return;\n    var v = findVettura(vId);\n    if (!v) return;\n    v.posizione = val;\n    v.aggiornato = nowTs();\n    saveState();\n    render();\n  }\n\n  // allinea \"Posizione vettura\" con la carrozzeria: in carrozzeria finche' il lavoro non e' ritirato\n  window.carrSync = function(m, jobs){\n    try{\n      if(!(puo('admin') || RUOLO==='officina')) return;\n      var nt=function(t){return String(t||'').toUpperCase().replace(/[^A-Z0-9]/g,'');};\n      var ch=false;\n      // vetture prese in carico dal carrozziere che non sono ancora in officina -> bozza da completare (solo admin)\n      if(RUOLO==='admin' && jobs && lastSyncOk){\n        jobs.forEach(function(j){\n          var t=nt(j.targa); if(!t) return;\n          var gia=(state.vetture||[]).some(function(v){ return v && (v.carrId===j.id || (!v.cancellata && nt(v.targa)===t)); });\n          if(gia) return;\n          state.vetture.push({id:uid(), tipo:j.veicolo||'Veicolo', targa:String(j.targa).toUpperCase().replace(/\\s/g,''), km:null, stato:'pianificare', priorita:'media', causale:'ripristino', posizione:'carrozzeria', posAuto:1, venditore:'', odlAperto:false, hcare:false, hcareFatto:false, lavori:[], ricambiMancanti:'', note:[], tempi:{inizio:null,fine:null}, creato:Date.now(), aggiornato:Date.now(), bozza:true, costi:[], carrId:j.id, fonte:'carrozzeria'});\n          ch=true;\n        });\n      }\n      (state.vetture||[]).forEach(function(v){\n        if(!v || v.cancellata) return;\n        var inC=!!m[nt(v.targa)];\n        if(inC && v.posizione!=='carrozzeria'){ v.posizione='carrozzeria'; v.posAuto=1; v.aggiornato=nowTs(); ch=true; }\n        else if(!inC && v.posizione==='carrozzeria' && v.posAuto){ v.posizione='stock'; tn')) return;\n    root.innerHTML = '';\n  });\n\n  function openArchivio(){\n    var root = document.getElementById('modalRoot');\n    var tutte = state.vetture.filter(function(v){ return isArchiviata(v) && !v.cancellata && !nascosta(v); });\n    tutte.sort(function(a,b){ return ((b.tempi && b.tempi.fine)||0) - ((a.tempi && a.tempi.fine)||0); });\n\n    root.innerHTML =\n      '<div class=\"overlay\" id=\"archiveOverlay\">' +\n        '<div class=\"modal\" style=\"max-width:560px;\">' +\n          '<div class=\"modal-head\"><h2>Archivio vetture pronte<\/h2><button class=\"modal-close\" id=\"closeArchive\">&times;<\/button><\/div>' +\n          '<div class=\"modal-body\">' +\n            '<input type=\"text\" id=\"archSearch\" class=\"archive-search\" placeholder=\"Cerca per targa, modello o venditore...\" value=\"' + escapeHtml(searchTerm || '') + '\" autocomplete=\"off\">' +\n            '<div class=\"archive-count\" id=\"archCount\"><\/div>' +\n            '<div id=\"archList\"><\/div>' +\n          '<\/div>' +\n        '<\/div>' +\n      '<\/div>';\n\n    // confronto \"morbido\": ignora maiuscole, spazi, trattini e punti (cos\u00ec \"ab 123 cd\" trova AB123CD)\n    function norm(x){ return (x === undefined || x === null ? '' : String(x)).toLowerCase().replace(/[\\s\\-\\.]/g, ''); }\n\n    function drawList(){\n      var t = norm(document.getElementById('archSearch').value);\n      var lista = tutte.filter(function(v){\n        return !t || norm(v.targa).indexOf(t) !== -1 || norm(v.tipo).indexOf(t) !== -1 || norm(v.venditore).indexOf(t) !== -1;\n      });\n      document.getElementById('archCount').textContent = tutte.length\n        ? (t ? lista.length + ' trovate su ' + tutte.length + ' in archivio' : tutte.length + ' vetture in archivio')\n        : '';\n      var html = lista.map(function(v){\n        var fine = v.tempi && v.tempi.fine;\n        var giorniPronta = fine ? Math.floor((nowTs() - fine) / (24*3600*1000)) : 0;\n        return '<div class=\"archive hint\">Costo orario usato dal capo officina per calcolare la manodopera nei costi di ripristino.<\/div>' +\n        '<div class=\"liste-add\"><input type=\"text\" id=\"tariffaInput\" inputmode=\"decimal\" value=\"' + String(tariffaOraria()||'').replace('.',',') + '\" placeholder=\"\u20ac all\\'ora (es. 38)\"><button class=\"btn btn-outline btn-sm\" id=\"tariffaSave\">Salva<\/button><\/div><\/div>';\n      root.innerHTML =\n        '<div class=\"overlay\" id=\"listeOverlay\">' +\n          '<div class=\"modal\" style=\"max-width:560px;\">' +\n            '<div class=\"modal-head\"><h2>Modifica elenchi<\/h2><button class=\"modal-close\" id=\"closeListe\">&times;<\/button><\/div>' +\n            '<div class=\"modal-body\">' + body + tariffaHtml +\n              '<div style=\"font-size:12px; color:var(--ink-soft);\">Le modifiche si salvano subito e valgono per tutti (anche nel file consegne). La priorit\u00e0 (Bassa/Media/Alta) resta fissa perch\u00e9 ordina le vetture in bacheca.<\/div>' +\n            '<\/div>' +\n            '<div class=\"modal-foot\"><button class=\"btn btn-primary\" id=\"doneListe\">Fatto<\/button><\/div>' +\n          '<\/div>' +\n        '<\/div>';\n\n      document.getElementById('tariffaSave').addEventListener('click', function(){\n        var n = parseImporto(document.getElementById('tariffaInput').value);\n        if (isNaN(n) || n < 0){ showToast('Importo non valido'); return; }\n        getListe().tariffaOraria = n; salva(); showToast('Tariffa salvata: ' + eur(n) + '/h');\n      });\n      document.getElementById('closeListe').addEventListener('click', chiudi);\n      document.getElementById('doneListe').addEventListener('click', chiudi);\n      document.getElementById('listeOverlay').addEventListener('click', function(e){ if (e.target.id === 'listeOverlay') chiudi(); });\n\n      root.querySelectorAll('[data-add]').forEach(function(btn){\n        function aggiungi(){\n          var key = btn.dataset.add;\n          var input = document.get id=\"venditoreFilter\"><option value=\"\">Tutti i venditori<\/option><\/select>\n    <span class=\"sync-indicator\" id=\"syncIndicator\">\u25cf Connessione...<\/span>\n    <button class=\"btn btn-ghost btn-sm\" id=\"refreshBtn\" title=\"Aggiorna ora\">\u27f3 Aggiorna<\/button>\n  <\/div>\n<\/header>\n\n<div class=\"tabs\">\n  <button class=\"tab-btn active\" id=\"tabPronte\">Da consegnare <span id=\"countPronte\" class=\"mono\"><\/span><\/button>\n  <button class=\"tab-btn\" id=\"tabConsegnate\">Storico consegne <span id=\"countConsegnate\" class=\"mono\"><\/span><\/button>\n  <button class=\"tab-btn\" id=\"tabHcare\" style=\"border-color:#A855F7; color:#6B21A8;\">\ud83d\udd0b H-Care <span id=\"countHcare\" class=\"mono\"><\/span><\/button>\n<\/div>\n<div class=\"content-wrap\">\n  <div class=\"panelbox\">\n    <div id=\"hcareAlertContainer\"><\/div>\n    <div class=\"grid\" id=\"board\"><\/div>\n  <\/div>\n<\/div>\n\n<footer class=\"hint\">Collegato alla stessa bacheca dell'officina: quando il capo officina sposta una vettura su \"Pronta\" compare qui in automatico (aggiornamento ogni ~7 secondi, o premi \"Aggiorna\"). Nessun account necessario.<\/footer>\n\n<div id=\"modalRoot\"><\/div>\n<div class=\"toast\" id=\"toast\"><\/div>\n\n<script>\n(function(){\n  \"use strict\";\n\n  var RUOLO = window.RUOLO || 'admin';\n  function puo(a){ return true; }\n  document.body.classList.add('ruolo-'+RUOLO);\n  var FIREBASE_URL = 'https://officina-toyota-hub-default-rtdb.europe-west1.firebasedatabase.app';\n  var FIREBASE_PATH = '/officina.json';\n\n  var LISTE_DEFAULT = {\n    venditori: ['MILIZIA','FASUOLO','SALTELLINI','GRECO','ESPOSITO','CHIMENTI','GENCARELLI','SICILIANO','OSSEQUIO'],\n    causali: [{id:'ripristino', label:'Ripristino pre-vendita'}, {id:'venduta', label:'Venduta (assistenza cliente)'}],\n    posizioni: [{id:'stock', label:'Stock'}, {id:'carrozzeria', label:'Carrozzeria'}],\n    aggiornato: 0\n  };\n  function cloneListeDefault(){ return JSON.parse(JSON.stringify(LISTE_DEFAULT)); }\n\n  // Le liste (venditori, tipi intervento, posizioni) vivono su Firebase insieme alle vetture.\n  // Firebase cancella gli array vuoti: se le liste sono state personalizzate (aggiornato > 0)\n  // un array mancante significa \"svuotato a mano\", non \"torna ai valori predefiniti\".\n  function normalizeListe(l){\n    var base = cloneListeDefault();\n    if (!l) return base;\n    var personalizzate = !!l.aggiornato;\n    ['venditori','causali','posizioni'].forEach(function(k){\n      if (Array.isArray(l[k])) base[k] = l[k].filter(Boolean);\n      else if (personalizzate) base[k] = [];\n    });\n    base.aggiornato = l.aggiornato || 0;\n    return base;\n  }\n  function getListe(){\n    if (!state.liste) state.liste = cloneListeDefault();\n    return state.liste;\n  }\n  function getVenditori(){ return getListe().venditori; }\n  function labelDa(lista, id){\n    for (var i=0;i<lista.length;i++){ if (lista[i].id === id) return lista[i].label; }\n    return id || '\u2014';\n  }\n  function labelCausale(id){ return labelDa(getListe().causali, id); }\n  function labelPosizione(id){ return labelDa(getListe().posizioni, id); }\n  function iconaCausale(id){ return id === 'venduta' ? '\ud83e\udd1d ' : (id === 'ripristino' ? '\ud83d\udd27 ' : '\ud83c\udff7 '); }\n  function iconaPosizione(id){ return id === 'carrozzeria' ? '\ud83c\udfa8 ' : (id === 'stock' ? '\ud83d\udce6 ' : '\ud83d\udccd '); }\n  function venditoriOpts(){ return getVenditori().map(function(n){ return {value:n, label:n}; }); }\n  function causaliOpts(){ return getListe().causali.map(function(c){ return {value:c.id, label:c.label}; }); }\n  function posizioniOpts(){ return getListe().posizioni.map(function(c){ return {value:c.id, label:c.label}; }); }\n  // Costruisce le <option>; se la vettura ha un valore non pi\u00f9 in elenco lo mantiene comunque selezionabile.\n  function optionsHtml(values, current, noneLabel){\n    var html = noneLabel ? '<option value=\"\">' + escapeHtml(noneLabel) + '<\/option>' : '';\n    var trovato = !current;\n    values.forEach(function(o){\n      if (o.value === current) trovato = true;\n      html += '<option value=\"' + escapeHtml(o.value) + '\"' + (o.value === current ? ' selected' : '') + '>' + escapeHtml(o.label) + '<\/option>';\n    });\n    if (!trovato) html += '<option value=\"' + escapeHtml(current) + '\" selected>' + escapeHtml(current) + '<\/option>';\n    return html;\n  }\n\n  var CAUSALE_LABEL = {ripristino:'Ripristino pre-vendita', venduta:'Venduta'};\n  var HCARE_SNOOZE_KEY = 'hcare_snooze_v1';\n  var HCARE_SNOOZE_DAYS = 2; // riappare dopo 2 giorni\n\n  function getSnooze(){\n    try{ return JSON.parse(localStorage.getItem(HCARE_SNOOZE_KEY)||'{}'); }catch(e){ return {}; }\n  }\n  function setSnooze(map){ localStorage.setItem(HCARE_SNOOZE_KEY, JSON.stringify(map)); }\n  function snoozeHcare(vId){\n    var map = getSnooze();\n    map[vId] = Date.now();\n    setSnooze(map);\n    renderHcareAlert();\n  }\n  function isHcareSnoozed(vId){\n    var map = getSnooze();\n    var ts = map[vId] || 0;\n    return (Date.now() - ts) < HCARE_SNOOZE_DAYS * 24 * 3600 * 1000;\n  }\n\n  function renderHcareAlert(){\n    var container = document.getElementById('hcareAlertContainer');\n    if (!container) return;\n    var daFare = VIS().filter(function(v){\n      return v.hcare && !v.hcareFatto && !v.cancellata && !isHcareSnoozed(v.id);\n    });\n    if (!daFare.length || activeTab === 'hcare'){\n      container.innerHTML = '';\n      return;\n    }\n    var items = daFare.map(function(v){\n      return '<div class=\"hcare-alert-item\">' +\n        '<div class=\"info\">\ud83d\udd0b <strong>' + escapeHtml(v.targa) + '<\/strong> \u2014 ' + escapeHtml(v.tipo) +\n          (v.venditore ? ' \u00b7 ' + escapeHtml(v.venditore) : '') + '<br><span style=\"font-size:11.5px;color:#7C3AED;\">Batteria sostituita \u2014 cliente da richiamare per ritorno a 500km<\/span><\/div>' +\n        '<button class=\"snooze\" data-vid=\"' + v.id + '\">Fatto \u00b7 snooze ' + HCARE_SNOOZE_DAYS + 'gg<\/button>' +\n      '<\/div>';\n    }).join('');\n    container.innerHTML =\n      '<div class=\"hcare-alert-bar\">' +\n        '<div class=\"icon\">\ud83d\udd0b<\/div>' +\n        '<div class=\"body\">' +\n          '<h4>H-Care da gestire \u2014 contatta i clienti<\/h4>' +\n          items +\n        '<\/div>' +\n      '<\/div>';\n    container.querySelectorAll('.snooze[data-vid]').forEach(function(btn){\n      btn.addEventListener('click', function(){ snoozeHcare(btn.dataset.vid); });\n    });\n  }\n\n  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }\n  function nowTs(){ return Date.now(); }\n\n  var state = { vetture: [], eventi: [], liste: cloneListeDefault() };\n  var pendingWrites = 0;\n  var searchTerm = '';\n  var venditoreFilterVal = '';\n  var activeTab = 'pronte';\n  var noteModalVehicleId = null;\n\n  function normalizeVettura(v){\n    if (!v.tempi) v.tempi = {};\n    if (typeof v.tempi.inizio === 'undefined') v.tempi.inizio = null;\n    if (typeof v.tempi.fine === 'undefined') v.tempi.fine = null;\n    if (!v.note) v.note = [];\n    if (!v.lavori) v.lavori = [];\n    if (typeof v.ricambiMancanti === 'undefined') v.ricambiMancanti = '';\n    if (typeof v.odlAperto === 'undefined') v.odlAperto = false;\n    if (typeof v.hcare === 'undefined') v.hcare = false;\n    if (typeof v.hcareFatto === 'undefined') v.hcareFatto = false;\n    if (typeof v.consegnata === 'undefined') v.consegnata = false;\n    if (typeof v.dataConsegna === 'undefined') v.dataConsegna = null;\n    return v;\n  }\n\n  function findVettura(id){\n    for (var i=0;i<state.vetture.length;i++){ if (state.vetture[i].id === id) return state.vetture[i]; }\n    return null;\n  }\n\n  function escapeHtml(s){\n    if (s === undefined || s === null) return '';\n    return String(s).replace(/&/g,'&amp;').replace(/<\/g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;');\n  }\n\n  function formatKm(km){\n    if (km === undefined || km === null || km === '') return '\u2014';\n    var n = parseInt(km,10);\n    if (isNaN(n)) return escapeHtml(km);\n    return n.toLocaleString('it-IT') + ' km';\n  }\n\n  function formatDateTime(ts){\n    if (!ts) return '\u2014';\n    var d = new Date(ts);\n    return d.toLocaleDateString('it-IT') + ' ' + d.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});\n  }\n\n  function giorniPronta(v){\n    var fine = v.tempi && v.tempi.fine ? v.tempi.fine : (v.aggiornato || v.creato || nowTs());\n    return Math.floor((nowTs() - fine) / (24*3600*1000));\n  }\n\n  function urgencyColor(giorni){\n    if (giorni >= 3) return '#D9622B';\n    if (giorni >= 1) return '#D9A226';\n    return '#3E8E5B';\n  }\n  function urgencyLabel(giorni){\n    if (giorni <= 0) return 'Pronta oggi';\n    if (giorni === 1) return 'Pronta da 1 giorno';\n    return 'Pronta da ' + giorni + ' giorni';\n  }\n\n  function showToast(msg){\n    var t = document.getElementById('toast');\n    t.textContent = msg;\n    t.classList.add('show');\n    setTimeout(function(){ t.classList.remove('show'); }, 1800);\n  }\n\n  function updateSyncIndicator(status, when){\n    var el = document.getElementById('syncIndicator');\n    if (!el) return;\n    el.classList.remove('ok','err');\n    if (status === 'ok'){\n      el.classList.add('ok');\n      var t = when ? new Date(when).toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit',second:'2-digit'}) : '';\n      el.textContent = '\u25cf Sincronizzato ' + t;\n    } else if (status === 'err'){\n      el.classList.add('err');\n      el.textContent = '\u25cf Errore di sincronizzazione';\n    } else {\n      el.textContent = '\u25cf Connessione...';\n    }\n  }\n\n  async function fetchCloudState(){\n    var res = await fetch(FIREBASE_URL + FIREBASE_PATH, {cache:'no-store'});\n    if (!res.ok) throw new Error('HTTP ' + res.status);\n    var data = await res.json();\n    if (data){\n      data.vetture = (data.vetture || []).map(normalizeVettura);\n      if (!data.eventi) data.eventi = [];\n      data.liste = normalizeListe(data.liste);\n      return data;\n    }\n    return { vetture: [], eventi: [], liste: cloneListeDefault() };\n  }\n\n  function mergeState(local, remote){\n    var map = {};\n    (local.vetture||[]).forEach(function(v){ map[v.id] = v; });\n    (remote.vetture||[]).forEach(function(rv){\n      var lv = map[rv.id];\n      var rvTime = rv.aggiornato || rv.creato || 0;\n      var lvTime = lv ? (lv.aggiornato || lv.creato || 0) : -1;\n      if (!lv || rvTime > lvTime){ map[rv.id] = rv; }\n    });\n    var ids = Object.keys(map);\n    ids.sort(function(a,b){ return (map[a].creato||0) - (map[b].creato||0); });\n\n    var eMap = {};\n    (local.eventi||[]).forEach(function(ev){ eMap[ev.id] = ev; });\n    (remote.eventi||[]).forEach(function(ev){ eMap[ev.id] = ev; });\n    var eIds = Object.keys(eMap);\n    eIds.sort(function(a,b){ return (eMap[b].data||0) - (eMap[a].data||0); });\n    if (eIds.length > 200) eIds = eIds.slice(0, 200);\n\n    var lL = normalizeListe(local.liste), rL = normalizeListe(remote.liste);\n    var liste = (rL.aggiornato > lL.aggiornato) ? rL : lL;\n\n    return { vetture: ids.map(function(id){ return map[id]; }), eventi: eIds.map(function(id){ return eMap[id]; }), liste: liste };\n  }\n\n  async function pushCloudState(){\n    pendingWrites++;\n    try{\n      var res = await fetch(FIREBASE_URL + FIREBASE_PATH, {\n        method: 'PUT', headers: {'Content-Type':'application/json'}, body: JSON.stringify(state)\n      });\n      if (!res.ok) throw new Error('HTTP ' + res.status);\n      updateSyncIndicator('ok', nowTs());\n    }catch(e){\n      console.error('Errore di sincronizzazione', e);\n      updateSyncIndicator('err');\n      showToast('Errore di sincronizzazione: la modifica resta solo su questo schermo, riprova.');\n    }finally{\n      pendingWrites--;\n    }\n  }\n\n  async function writeChange(mutateFn){\n    // Rilegge lo stato fresco, applica la modifica e la fonde per non perdere le scritture dell'officina.\n    try{\n      var fresh = await fetchCloudState();\n      state = mergeState(state, fresh);\n    }catch(e){ /* usa lo stato locale se la lettura fallisce */ }\n    mutateFn();\n    await pushCloudState();\n    render();\n  }\n\n  function creaEvento(vId, tipo, testo){\n    var v = findVettura(vId);\n    if (!state.eventi) state.eventi = [];\n    state.eventi.unshift({\n      id: uid(), vehicleId: vId, vehicleTarga: v ? v.targa : '', vehicleTipo: v ? v.tipo : '',\n      tipo: tipo, testo: testo, data: nowTs()\n    });\n    if (state.eventi.length > 200) state.eventi = state.eventi.slice(0, 200);\n  }\n\n  function segnaConsegnata(id){ if(!puo('vendite')) return;\n    var v = findVettura(id);\n    if (!v) return;\n    if (!confirm('Segnare la vettura ' + v.targa + ' come consegnata al cliente?')) return;\n    writeChange(function(){\n      var vv = findVettura(id);\n      if (!vv) return;\n      vv.consegnata = true;\n      vv.dataConsegna = nowTs();\n      vv.aggiornato = nowTs();\n      creaEvento(id, 'stato', 'Consegnata al cliente da vendite');\n    }).then(function(){ showToast('Vettura segnata come consegnata'); });\n  }\n\n  function riportaInConsegna(id){ if(!puo('vendite')) return;\n    writeChange(function(){\n      var vv = findVettura(id);\n      if (!vv) return;\n      vv.consegnata = false;\n      vv.dataConsegna = null;\n      vv.aggiornato = nowTs();\n      creaEvento(id, 'stato', 'Riportata tra le vetture da consegnare');\n    }).then(function(){ showToast('Vettura riportata tra quelle da consegnare'); });\n  }\n\n  function impostaVenditore(id, val){ if(!puo('vendite')) return;\n    writeChange(function(){\n      var vv = findVettura(id);\n      if (!vv) return;\n      vv.venditore = val;\n      vv.aggiornato = nowTs();\n    }).then(function(){ showToast('Venditore assegnato'); });\n  }\n\n  function apriModaleNota(id){ if(!puo('vendite')) return;\n    noteModalVehicleId = id;\n    var v = findVettura(id);\n    var root = document.getElementById('modalRoot');\n    root.innerHTML =\n      '<div class=\"overlay\" id=\"notaOverlay\">' +\n        '<div class=\"modal\">' +\n          '<div class=\"modal-head\"><h2>Nota per l\\'officina \u2014 ' + escapeHtml(v.targa) + '<\/h2><button class=\"modal-close\" id=\"closeNota\">&times;<\/button><\/div>' +\n          '<div class=\"modal-body\">' +\n            '<div class=\"field\"><label>Messaggio<\/label><textarea id=\"notaTesto\" placeholder=\"es. Cliente confermato per ritiro venerd\u00ec...\"><\/textarea><\/div>' +\n          '<\/div>' +\n          '<div class=\"modal-foot\">' +\n            '<button class=\"btn btn-outline\" id=\"cancelNota\">Annulla<\/button>' +\n            '<button class=\"btn btn-primary\" id=\"confirmNota\">Invia<\/button>' +\n          '<\/div>' +\n        '<\/div>' +\n      '<\/div>';\n    function close(){ root.innerHTML = ''; noteModalVehicleId = null; }\n    document.getElementById('closeNota').addEventListener('click', close);\n    document.getElementById('cancelNota').addEventListener('click', close);\n    document.getElementById('notaOverlay').addEventListener('click', function(e){ if (e.target.id === 'notaOverlay') close(); });\n    document.getElementById('confirmNota').addEventListener('click', function(){\n      var testo = document.getElementById('notaTesto').value.trim();\n      if (!testo) { close(); return; }\n      writeChange(function(){\n        var vv = findVettura(id);\n        if (!vv) return;\n        vv.note.push({testo:testo, data:nowTs()});\n        vv.aggiornato = nowTs();\n        creaEvento(id, 'nota', testo);\n      }).then(function(){ showToast('Nota inviata all\\'officina'); });\n      close();\n    });\n    setTimeout(function(){ document.getElementById('notaTesto').focus(); }, 50);\n  }\n\n  function matchesSearch(v){\n    if (!searchTerm) return true;\n    var t = searchTerm.toLowerCase();\n    return (v.targa||'').toLowerCase().indexOf(t) !== -1 ||\n           (v.tipo||'').toLowerCase().indexOf(t) !== -1 ||\n           (v.venditore||'').toLowerCase().indexOf(t) !== -1;\n  }\n  function matchesVenditoreFilter(v){\n    if (!venditoreFilterVal) return true;\n    return (v.venditore||'') === venditoreFilterVal;\n  }\n\n  var filtroVenditoriFirma = null;\n  function updateVenditoreFilterOptions(){\n    var sel = document.getElementById('venditoreFilter');\n    var nomi = getVenditori().slice();\n    // se \u00e8 attivo un filtro su un venditore non pi\u00f9 in elenco, lo teniamo comunque selezionabile\n    if (venditoreFilterVal && nomi.indexOf(venditoreFilterVal) === -1) nomi.push(venditoreFilterVal);\n    var firma = nomi.join('|');\n    if (firma === filtroVenditoriFirma) return; // elenco invariato: non ricostruire (chiuderebbe la tendina aperta)\n    filtroVenditoriFirma = firma;\n    var current = sel.value || venditoreFilterVal;\n    sel.innerHTML = '<option value=\"\">Tutti i venditori<\/option>' + nomi.map(function(n){\n      return '<option value=\"' + escapeHtml(n) + '\">' + escapeHtml(n) + '<\/option>';\n    }).join('');\n    sel.value = current;\n  }\n\n  // ---- ruolo venditore: vede solo le proprie consegne ----\n  var NOME = '', NOME_MSG = '';\n  function mio(v){ return !v.bozza && (RUOLO !== 'vendite' || (NOME && v.venditore === NOME)); }\n  function VIS(){ return state.vetture.filter(mio); }\n  function risolviNome(){\n    if (RUOLO !== 'vendite') return;\n    var K = '';\n    try{ K = new URLSearchParams(window.parent.location.search).get('k') || ''; }catch(e){}\n    try{ if (K) localStorage.setItem('perf_k', K); else K = localStorage.getItem('perf_k') || ''; }catch(e){}\n    if (!K){ NOME_MSG = 'Apri il tuo link personale (quello che ti ha inviato l\\'amministratore) per vedere le tue consegne.'; render(); return; }\n    NOME_MSG = 'Caricamento delle tue consegne...';\n    fetch(FIREBASE_URL + '/perf/' + encodeURIComponent(K) + '.json', {cache:'no-store'}).then(function(r){ return r.json(); }).then(function(d){\n      if (d && d.nome){ NOME = d.nome; NOME_MSG = ''; }\n      else NOME_MSG = 'Link personale non valido. Chiedi all\\'amministratore un nuovo link.';\n      render();\n    }).catch(function(){ NOME_MSG = 'Errore di connessione, riprova.'; render(); });\n  }\n  function render(){\n    if (RUOLO === 'vendite' && !NOME){\n      document.getElementById('board').innerHTML = '<div class=\"board-loading\">' + escapeHtml(NOME_MSG || 'Caricamento...') + '<\/div>';\n      return;\n    }\n    updateVenditoreFilterOptions();\n    var pronteList = VIS().filter(function(v){ return v.stato === 'pronta' && !v.cancellata && !v.consegnata; });\n    var consegnateList = VIS().filter(function(v){ return v.stato === 'pronta' && !v.cancellata && v.consegnata; });\n    var hcareList = VIS().filter(function(v){ return v.hcare && !v.hcareFatto && !v.cancellata; });\n\n    document.getElementById('countPronte').textContent = '(' + pronteList.length + ')';\n    document.getElementById('countConsegnate').textContent = '(' + consegnateList.length + ')';\n    var hcCount = document.getElementById('countHcare');\n    if (hcCount) hcCount.textContent = hcareList.length ? '(' + hcareList.length + ')' : '';\n\n    renderHcareAlert();\n\n    var board = document.getElementById('board');\n    board.innerHTML = '';\n\n    var list;\n    if (activeTab === 'pronte') list = pronteList.filter(matchesSearch).filter(matchesVenditoreFilter);\n    else if (activeTab === 'consegnate') list = consegnateList.filter(matchesSearch).filter(matchesVenditoreFilter);\n    else list = hcareList.filter(matchesSearch).filter(matchesVenditoreFilter); // tab hcare\n\n    if (activeTab === 'pronte') list.sort(function(a,b){ return giorniPronta(b) - giorniPronta(a); });\n    else if (activeTab === 'consegnate') list.sort(function(a,b){ return (b.dataConsegna||0) - (a.dataConsegna||0); });\n    else list.sort(function(a,b){ return (a.hcareRichiestoPer||a.creato||0) - (b.hcareRichiestoPer||b.creato||0); });\n\n    if (list.length === 0){\n      var empty = document.createElement('div');\n      empty.className = 'empty-state';\n      empty.textContent = activeTab === 'pronte' ? 'Nessuna vettura pronta al momento.' :\n                          activeTab === 'consegnate' ? 'Nessuna consegna registrata ancora.' :\n                          '\u2713 Nessun H-Care in sospeso al momento.';\n      board.appendChild(empty);\n      return;\n    }\n\n    list.forEach(function(v){ board.appendChild(renderCard(v)); });\n  }\n\n  function renderCard(v){\n    var card = document.createElement('div');\n    var giorni = giorniPronta(v);\n    var uColor = urgencyColor(giorni);\n    card.className = 'card';\n    card.style.setProperty('--urgency-color', v.consegnata ? '#3E8E5B' : uColor);\n\n    var meta = '<span class=\"pill pill-steel\">' + (v.tempi && v.tempi.fine ? 'pronta il ' + formatDateTime(v.tempi.fine) : 'pronta') + '<\/span>';\n    if (v.lavori && v.lavori.length){\n      var fatti = v.lavori.filter(function(l){return l.fatto;}).length;\n      meta += '<span class=\"pill pill-grey\">' + fatti + '/' + v.lavori.length + ' lavori<\/span>';\n    }\n\n    var notePreview = '';\n    if (v.note && v.note.length){\n      var last = v.note[v.note.length-1];\n      notePreview = '<div class=\"note-preview\">\"' + escapeHtml(last.testo) + '\"<\/div>';\n    }\n\n    var venditoreOptions = optionsHtml(venditoriOpts(), v.venditore || '', '\u2014 Nessuno \u2014');\n\n    card.innerHTML =\n      '<div class=\"card-top\">' +\n        '<div class=\"targa\"><span class=\"strip\">I<\/span><span class=\"code\">' + escapeHtml(v.targa || '\u2014') + '<\/span><\/div>' +\n        '<span class=\"urgency-badge\">' + (v.consegnata ? '\u2713 Consegnata' : urgencyLabel(giorni)) + '<\/span>' +\n      '<\/div>' +\n      '<div class=\"card-tipo\">' + escapeHtml(v.tipo || 'Veicolo') + '<\/div>' +\n      '<div class=\"card-km mono\">' + formatKm(v.km) + '<\/div>' +\n      '<div class=\"tag-row\" styl
